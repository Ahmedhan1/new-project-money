# NEXUS language packs. One entry per BCP-47-style tag. Adding a language = one pack entry here (+ fonts on the
# machine, + optionally a voice). Format, rules and the licence table: docs/LANGUAGES.md.
#
# Licence facts were read on 2026-11-12 from the sources cited per entry. `commercial_use` is a QUOTED string:
#   "yes"         the voice model card AND its training dataset (and the base model it was fine-tuned from) allow it
#   "no"          a licence in the chain forbids commercial use (e.g. CC BY-NC-SA)
#   "unverified"  the card says "Unknown"/"See URL", the URL has no licence, or a fine-tuning base model is research-only
# A licence is never upgraded by assumption. NEXUS never selects a voice whose commercial_use != "yes" unless the
# caller passes allow_unlicensed_voice=True, and the choice is then reported in the language QA.
schema_version: 1
read_on: "2026-11-12"

sources:
  piper_voices_index: "https://huggingface.co/rhasspy/piper-voices/resolve/main/voices.json (read 2026-11-12)"
  piper_model_cards: "https://huggingface.co/rhasspy/piper-voices/tree/main/<lang>/<locale>/<name>/<quality>/MODEL_CARD (each read 2026-11-12)"
  piper_repo_licence: "rhasspy/piper-voices repo metadata: MIT (the per-voice DATASET licence is what limits use)"
  ohf_voice_datasets: "https://github.com/OHF-Voice/voice-datasets - README: 'These datasets are licensed under CC0' (read 2026-11-12)"
  hifi_tts: "https://www.openslr.org/109/ - Hi-Fi TTS licence CC BY 4.0 (read 2026-11-12); base model of several Piper 1.5 voices"
  lessac_base: "https://www.cstr.ed.ac.uk/projects/blizzard/2013/lessac_blizzard2013/license.html - Blizzard 2013 Lessac licence (research use); voices fine-tuned from Piper's lessac checkpoint are marked unverified"
  madlad_card: "https://huggingface.co/google/madlad400-3b-mt (Apache-2.0; 'research models have not been assessed for production usecases'; read 2026-11-12)"
  madlad_vocab: "https://huggingface.co/Nextcloud-AI/madlad400-3b-mt-ct2-int8/resolve/main/shared_vocabulary.json - 492 <2xx> target tokens (checked 2026-11-12)"
  whisper: "https://github.com/openai/whisper (MIT; 99-language tokenizer list), weights via Systran/faster-whisper-small (MIT)"
  subtitle_norms: "editorial defaults in line with common streaming/broadcast practice (42 chars x 2 lines for alphabetic scripts, ~16/13 chars for Chinese/Japanese); NOT individually re-verified against a distributor guide - check yours"

# MADLAD-400 target tokens that were verified to exist in the model vocabulary (2026-11-12). Pack mt.target must be one.
# Checked and ABSENT: afb (Gulf Arabic), acm, apc, ajp, aeb, ars, acw, ayl, shu, yue.
mt_supported_targets: [en, de, fr, ar, arz, ary, zh, zh_Hant, ru, hi, es, pt, tr, id, ja]

aliases:
  ar-msa: ar
  arb: ar
  ar-eg: ar-EG
  arz: ar-EG
  egyptian: ar-EG
  ar-gulf: ar-Gulf
  afb: ar-Gulf
  ar-kw: ar-Gulf
  ar-ae: ar-Gulf
  ar-sa: ar-Gulf
  ar-qa: ar-Gulf
  ar-bh: ar-Gulf
  ar-om: ar-Gulf
  zh-cn: zh
  zh-hans: zh
  pt-br: pt
  en-us: en
  en-gb: en
  de-de: de
  fr-fr: fr
  es-es: es

# Fonts: ordered candidate files per script set. {WINFONTS} = %WINDIR%\Fonts, {USERFONTS} = NEXUS_HOME/assets/fonts
# (drop a font there to add coverage), "#n" = face index inside a .ttc. The first existing file that covers the
# pack's sample text wins; config.font_report(tag) says which one and what is missing.
font_sets:
  latin:
    files:
      - "{USERFONTS}/NotoSans-Bold.ttf"
      - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - /usr/share/fonts/truetype/noto/NotoSans-Bold.ttf
      - /usr/share/fonts/truetype/freefont/FreeSansBold.ttf
      - /usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf
      - "{WINFONTS}/segoeuib.ttf"
      - "{WINFONTS}/arialbd.ttf"
      - /System/Library/Fonts/Supplemental/Arial Bold.ttf
      - /Library/Fonts/Arial Bold.ttf
    families: [DejaVu Sans, Noto Sans, FreeSans, Segoe UI, Arial]
  arabic:
    files:
      - "{USERFONTS}/NotoNaskhArabic-Bold.ttf"
      - /usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf
      - /usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf
      - /usr/share/fonts/opentype/noto/NotoNaskhArabic-Bold.otf
      - /usr/share/fonts/truetype/kacst/KacstOne-Bold.ttf
      - /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
      - /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf
      - /usr/share/fonts/truetype/freefont/FreeSerif.ttf
      - "{WINFONTS}/tahomabd.ttf"
      - "{WINFONTS}/segoeuib.ttf"
      - "{WINFONTS}/arialbd.ttf"
      - /System/Library/Fonts/GeezaPro.ttc
      - /System/Library/Fonts/Supplemental/GeezaPro.ttc
    families: [Noto Naskh Arabic, Noto Sans Arabic, DejaVu Sans, Tahoma, Segoe UI, Arial, Geeza Pro]
  cjk_sc:
    files:
      - "{USERFONTS}/NotoSansSC-Bold.otf"
      - "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc#2"
      - "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc#2"
      - /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
      - /usr/share/fonts/truetype/wqy/wqy-microhei.ttc
      - /usr/share/fonts/truetype/arphic/uming.ttc
      - "{WINFONTS}/msyhbd.ttc"
      - "{WINFONTS}/msyh.ttc"
      - "{WINFONTS}/simhei.ttf"
      - /System/Library/Fonts/PingFang.ttc
      - /System/Library/Fonts/STHeiti Medium.ttc
    families: [Noto Sans CJK SC, WenQuanYi Zen Hei, WenQuanYi Micro Hei, Microsoft YaHei, SimHei, PingFang SC]
  cjk_ja:
    files:
      - "{USERFONTS}/NotoSansJP-Bold.otf"
      - "/usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc#0"
      - "/usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc#0"
      - /usr/share/fonts/opentype/ipafont-gothic/ipag.ttf
      - /usr/share/fonts/truetype/fonts-japanese-gothic.ttf
      - /usr/share/fonts/truetype/takao-gothic/TakaoPGothic.ttf
      - /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc
      - "{WINFONTS}/YuGothB.ttc"
      - "{WINFONTS}/meiryob.ttc"
      - "{WINFONTS}/msgothic.ttc"
      - /System/Library/Fonts/Hiragino Sans GB.ttc
    families: [Noto Sans CJK JP, IPAGothic, TakaoPGothic, Yu Gothic, Meiryo, MS Gothic, Hiragino Sans]
  devanagari:
    files:
      - "{USERFONTS}/NotoSansDevanagari-Bold.ttf"
      - /usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf
      - /usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf
      - /usr/share/fonts/opentype/noto/NotoSansDevanagari-Bold.otf
      - /usr/share/fonts/truetype/lohit-devanagari/Lohit-Devanagari.ttf
      - /usr/share/fonts/truetype/freefont/FreeSans.ttf
      - /usr/share/fonts/truetype/freefont/FreeSerif.ttf
      - "{WINFONTS}/NirmalaB.ttf"
      - "{WINFONTS}/Nirmala.ttf"
      - "{WINFONTS}/mangal.ttf"
      - /System/Library/Fonts/Kohinoor.ttc
      - /System/Library/Fonts/Supplemental/DevanagariMT.ttc
    families: [Noto Sans Devanagari, Lohit Devanagari, FreeSans, Nirmala UI, Mangal, Kohinoor Devanagari]
  last_resort:
    # Covers almost the whole BMP but has no OpenType shaping for Arabic/Devanagari: legible boxes-free fallback only.
    last_resort: true
    files:
      - /usr/share/fonts/opentype/unifont/unifont.otf
      - /usr/share/fonts/truetype/unifont/unifont.ttf
    families: [Unifont]

subtitle_defaults:
  max_chars_per_line: 42
  max_lines: 2
  max_cps: 17          # characters per second incl. spaces
  min_duration: 0.8
  max_duration: 7.0
  min_gap: 0.08
  max_extend: 0.8      # how far a cue may run past the end of its speech span to stay readable
  line_break: space    # space = break between words; char = break between characters/segments (CJK)
  break_after: ".!?…;:,"
  punctuation: ".,!?;:…\"'()-"
  numerals: latn
  karaoke: true        # word-level highlight is meaningful (word timings exist / words are space separated)

packs:
  en:
    name: English
    native_name: English
    script: Latn
    direction: ltr
    status: proven            # proven = used in an e2e test before (Test C); implemented = pack + unit tests only
    sample: "The quick brown fox jumps over the lazy dog."
    fonts: [latin, last_resort]
    asr: {model: whisper-small, code: en, licence: MIT, commercial_use: "yes"}
    mt: {model: mt-madlad400-3b, target: en, licence: "Apache-2.0", commercial_use: "yes", length_ratio: [0.5, 1.6]}
    tts:
      voices:
        - id: en_US-joe-medium
          engine: piper
          path: en/en_US/joe/medium
          gender: male
          source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/en/en_US/joe/medium/MODEL_CARD
          licence: "dataset CC0 (OHF-Voice/voice-datasets); base model rdh (CC0 per card)"
          dataset_licence: CC0
          commercial_use: "yes"
          card_read_on: "2026-11-12"
        - id: en_US-ljspeech-medium
          engine: piper
          path: en/en_US/ljspeech/medium
          gender: female
          source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/en/en_US/ljspeech/medium/MODEL_CARD
          licence: "public domain (LJ Speech); trained from scratch"
          dataset_licence: public domain
          commercial_use: "yes"
          card_read_on: "2026-11-12"
      fallback: {engine: espeak-ng, voice: en-us, licence: "GPL-3.0 engine; generated audio is not covered by the GPL", commercial_use: "yes"}
    subtitles: {max_cps: 20}
    typography: {quotes: ["“", "”"]}
    needs_native_review: false

  de:
    name: German
    native_name: Deutsch
    script: Latn
    direction: ltr
    status: proven
    sample: "Größere Übungen für Äpfel, Öl und Straße."
    fonts: [latin, last_resort]
    asr: {model: whisper-small, code: de, licence: MIT, commercial_use: "yes"}
    mt: {model: mt-madlad400-3b, target: de, licence: "Apache-2.0", commercial_use: "yes", length_ratio: [0.6, 1.45]}
    tts:
      voices:
        - id: de_DE-thorsten-medium
          engine: piper
          path: de/de_DE/thorsten/medium
          gender: male
          source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/de/de_DE/thorsten/medium/MODEL_CARD
          licence: "dataset CC0 (Thorsten-Voice); base model rdh (CC0 per card)"
          dataset_licence: CC0
          commercial_use: "yes"
          card_read_on: "2026-11-12"
        - id: de_DE-kerstin-medium
          engine: piper
          path: de/de_DE/kerstin/medium
          gender: female
          source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/de/de_DE/kerstin/medium/MODEL_CARD
          licence: "dataset CC0 (OHF-Voice/voice-datasets); base model hifi_tts_92 (Hi-Fi TTS, CC BY 4.0)"
          dataset_licence: CC0
          base_licence: "CC BY 4.0 (attribution: Hi-Fi TTS)"
          commercial_use: "yes"
          card_read_on: "2026-11-12"
      fallback: {engine: espeak-ng, voice: de, licence: "GPL-3.0 engine; generated audio is not covered by the GPL", commercial_use: "yes"}
    subtitles: {max_cps: 17}
    typography: {quotes: ["„", "“"], keep: "ß and umlauts are preserved (NFC); uppercase ß becomes SS (Unicode default)"}
    needs_native_review: false

  fr:
    name: French
    native_name: Français
    script: Latn
    direction: ltr
    status: implemented
    sample: "Où est l’élève ? « Ça va » : très bien !"
    fonts: [latin, last_resort]
    asr: {model: whisper-small, code: fr, licence: MIT, commercial_use: "yes"}
    mt: {model: mt-madlad400-3b, target: fr, licence: "Apache-2.0", commercial_use: "yes", length_ratio: [0.6, 1.5]}
    tts:
      voices:
        - id: fr_FR-siwis-medium
          engine: piper
          path: fr/fr_FR/siwis/medium
          gender: female
          source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/fr/fr_FR/siwis/medium/MODEL_CARD
          licence: "dataset CC BY 4.0 (SIWIS, datashare.is.ed.ac.uk/handle/10283/2353); base hifi_tts_92 (CC BY 4.0)"
          dataset_licence: "CC BY 4.0 - attribution required"
          commercial_use: "yes"
          attribution: "SIWIS French Speech Synthesis Database (CC BY 4.0); Hi-Fi TTS (CC BY 4.0)"
          card_read_on: "2026-11-12"
        - id: fr_FR-mls-medium
          engine: piper
          path: fr/fr_FR/mls/medium
          gender: multi
          source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/fr/fr_FR/mls/medium/MODEL_CARD
          licence: "dataset CC BY 4.0 (Multilingual LibriSpeech, openslr.org/94); trained from scratch"
          dataset_licence: "CC BY 4.0 - attribution required"
          commercial_use: "yes"
          attribution: "Multilingual LibriSpeech (CC BY 4.0)"
          card_read_on: "2026-11-12"
        - id: fr_FR-upmc-medium
          engine: piper
          path: fr/fr_FR/upmc/medium
          gender: multi
          source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/fr/fr_FR/upmc/medium/MODEL_CARD
          licence: "dataset CC BY-SA 4.0; fine-tuned from the lessac voice (Blizzard 2013 research licence)"
          dataset_licence: "CC BY-SA 4.0"
          commercial_use: "unverified"
          card_read_on: "2026-11-12"
        - id: fr_FR-tom-medium
          engine: piper
          path: fr/fr_FR/tom/medium
          gender: male
          source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/fr/fr_FR/tom/medium/MODEL_CARD
          licence: "card: AGPLv3 (applied to a voice model; effect on generated audio not established)"
          dataset_licence: AGPLv3
          commercial_use: "unverified"
          card_read_on: "2026-11-12"
      fallback: {engine: espeak-ng, voice: fr-fr, licence: "GPL-3.0 engine; generated audio is not covered by the GPL", commercial_use: "yes"}
    subtitles: {max_cps: 17}
    typography: {quotes: ["«", "»"], quote_inner_space: true, space_before_high_punct: true}
    needs_native_review: false

  ar:
    name: Modern Standard Arabic
    native_name: العربية الفصحى
    script: Arab
    direction: rtl
    status: proven
    sample: "الطاقة الشمسية أرخص مصدر للكهرباء، أليس كذلك؟"
    fonts: [arabic, last_resort]
    asr: {model: whisper-small, code: ar, licence: MIT, commercial_use: "yes", note: "Whisper has one Arabic code; dialects are transcribed as 'ar'"}
    mt: {model: mt-madlad400-3b, target: ar, licence: "Apache-2.0", commercial_use: "yes", length_ratio: [0.55, 1.35]}
    tts:
      voices:
        - &kareem
          id: ar_JO-kareem-medium
          engine: piper
          path: ar/ar_JO/kareem/medium
          gender: male
          source_url: https://huggingface.co/rhasspy/piper-voices/blob/main/ar/ar_JO/kareem/medium/MODEL_CARD
          licence: "card: 'License: See URL'; dataset repo github.com/AliMokhammad/arabicttstrain has no licence file; fine-tuned from lessac (Blizzard 2013 research licence)"
          dataset_licence: "none stated"
          commercial_use: "unverified"
          card_read_on: "2026-11-12"
          note: "Only Arabic Piper voice. Jordanian/MSA-leaning accent, not Egyptian or Gulf."
      fallback: {engine: espeak-ng, voice: ar, licence: "GPL-3.0 engine; generated audio is not covered by the GPL", commercial_use: "yes"}
    subtitles: {max_cps: 17, numerals: arab, break_after: ".!?؟…؛:،,", punctuation: "،؛؟.!:«»()"}
    typography: {quotes: ["«", "»"], punct_map: {",": "،", ";": "؛", "?": "؟"}}
    needs_native_review: false

  ar-EG:
    name: Egyptian Arabic
    native_name: العربية المصرية
    script: Arab
    direction: rtl
    status: proven
    sample: "ده بيخلّي الطاقة الشمسية أرخص مصدر للكهربا، مش كده؟"
    fonts: [arabic, last_resort]
    asr: {model: whisper-small, code: ar, licence: MIT, commercial_use: "yes", note: "no Egyptian-specific Whisper code"}
    mt:
      model: mt-madlad400-3b
      target: arz
      licence: "Apache-2.0"
      commercial_use: "yes"
      length_ratio: [0.55, 1.35]
      note: "<2arz> exists in the MADLAD vocabulary and produced Egyptian forms in Test C; arz comes from MADLAD's noisy web data, so the rule layer below runs on top"
    tts:
      voices:
        - *kareem
      fallback: {engine: espeak-ng, voice: ar, licence: "GPL-3.0 engine; generated audio is not covered by the GPL", commercial_use: "yes"}
    subtitles: {max_cps: 17, numerals: arab, break_after: ".!?؟…؛:،,", punctuation: "،؛؟.!:«»()"}
    typography: {quotes: ["«", "»"], punct_map: {",": "،", ";": "؛", "?": "؟"}}
    needs_native_review: true
    dialect:
      base: ar
      variant: "Cairene (Masri)"
      adaptation: rule-based
      quality_statement: >-
        Rule-based adaptation layer: MADLAD-400 output (arz, else MSA) followed by word/phrase substitutions for
        common function words and expressions. It produces recognisably Egyptian function words, not native-quality
        Egyptian writing: verb morphology, word order, idiom and register are mostly left as the MT produced them.
        A native Egyptian reviewer must approve every line before publishing.
      llm_style: |-
        Egyptian colloquial Arabic (Masri) as spoken in Cairo, written in Arabic script only.
        Use everyday Egyptian words, for example: ده/دي (this), مش (not), عشان (because), دلوقتي (now), إزاي (how),
        ليه (why), كده (like this), اللي (which), أوي (very), بتاع (of), and b-prefixed present verbs such as بيحوّل، بنستخدم.
        Example - MSA: "هذا يجعل الطاقة الشمسية أرخص مصدر للكهرباء" -> Masri: "ده بيخلّي الطاقة الشمسية أرخص مصدر للكهربا".
      markers: [ده, دي, مش, عشان, علشان, دلوقتي, إزاي, ازاي, ليه, كده, اللي, أوي, قوي, بتاع, إحنا, احنا, كمان, بقى, لسه, عايز, فيه, زي, يعني, إيه, فين, بس, حاجة, كويس]
      lexicon:
        - {msa: [هذا], dialect: ده}
        - {msa: [هذه], dialect: دي}
        - {msa: [ذلك], dialect: ده}
        - {msa: [تلك], dialect: دي}
        - {msa: [هؤلاء], dialect: دول}
        - {msa: [ليس, ليست, لسنا], dialect: مش}
        - {msa: [لماذا], dialect: ليه}
        - {msa: [كيف], dialect: إزاي}
        - {msa: [ماذا], dialect: إيه}
        - {msa: [متى], dialect: إمتى}
        - {msa: [أين], dialect: فين}
        - {msa: [الآن], dialect: دلوقتي}
        - {msa: [لأن, لان], dialect: عشان}
        - {msa: [جدا, جداً], dialect: أوي}
        - {msa: [الذي, التي, الذين, اللذان, اللتان], dialect: اللي}
        - {msa: [أريد], dialect: عايز}
        - {msa: [نريد], dialect: عايزين}
        - {msa: [يريد], dialect: عايز}
        - {msa: [هناك], dialect: فيه}
        - {msa: [أيضا, أيضاً], dialect: كمان}
        - {msa: [فقط], dialect: بس}
        - {msa: [لكن, ولكن], dialect: بس}
        - {msa: [مثل], dialect: زي}
        - {msa: [شيء, شيئا, شيئاً], dialect: حاجة}
        - {msa: [جيد], dialect: كويس}
        - {msa: [نعم], dialect: أيوه}
        - {msa: [نحن], dialect: إحنا}
        - {msa: [يجعل], dialect: بيخلّي}
        - {msa: [يجعلها], dialect: بيخلّيها}
        - {msa: [يعمل], dialect: بيشتغل}
        - {msa: [الكهرباء], dialect: الكهربا}
        - {msa: [هكذا], dialect: كده}
      patterns:
        - {match: "سوف ([يتنأ])", replace: "ه\\1", note: "future particle -> h- prefix (هيكون)"}
      pronunciation:
        ده: دَه
        دي: دِي
        دلوقتي: دِلْوَقْتِي
        إزاي: إِزَّاي
        عشان: عَشَان
        أوي: أَوِي
        كده: كِدَه

  ar-Gulf:
    name: Gulf Arabic
    native_name: العربية الخليجية
    script: Arab
    direction: rtl
    status: implemented
    sample: "هذي الطاقة الشمسية أرخص مصدر للكهربا، صح؟"
    fonts: [arabic, last_resort]
    asr: {model: whisper-small, code: ar, licence: MIT, commercial_use: "yes", note: "no Gulf-specific Whisper code"}
    mt:
      model: mt-madlad400-3b
      target: ar
      licence: "Apache-2.0"
      commercial_use: "yes"
      length_ratio: [0.55, 1.35]
      note: "MADLAD-400 has no Gulf Arabic target (afb/acm/ars absent from the vocabulary, checked 2026-11-12): translate to MSA, then adapt"
    tts:
      voices:
        - *kareem
      fallback: {engine: espeak-ng, voice: ar, licence: "GPL-3.0 engine; generated audio is not covered by the GPL", commercial_use: "yes"}
    subtitles: {max_cps: 17, numerals: arab, break_after: ".!?؟…؛:،,", punctuation: "،؛؟.!:«»()"}
    typography: {quotes: ["«", "»"], punct_map: {",": "،", ";": "؛", "?": "؟"}}
    needs_native_review: true
    dialect:
      base: ar
      variant: "Eastern Gulf (Kuwait/Bahrain/Qatar/UAE-leaning khaleeji; Saudi Najdi forms such as وش are not used)"
      adaptation: rule-based
      quality_statement: >-
        Rule-based adaptation layer over MSA machine translation (no Gulf Arabic MT model exists in the stack).
        It swaps common function words and expressions for Gulf forms; grammar, verb morphology, idiom and register
        remain MSA-like, and Gulf varieties differ between countries. This is not native-quality Gulf writing.
        A native Gulf reviewer must approve every line before publishing.
      llm_style: |-
        Gulf Arabic (khaleeji, Kuwait/Bahrain/Qatar/UAE usage), written in Arabic script only.
        Use everyday Gulf words, for example: هذي (this, f.), شنو (what), ليش (why), شلون (how), الحين (now), وايد (very/many),
        أبي/نبي (I/we want), مو (not), وين (where), اللي (which), زين (good), شي (thing), راح + verb (future).
        Example - MSA: "لماذا هذه الطاقة رخيصة الآن؟" -> Gulf: "ليش هذي الطاقة رخيصة الحين؟".
      markers: [هذي, شنو, ليش, شلون, الحين, وايد, أبي, نبي, يبي, مو, وين, اللي, زين, شي, راح, هذولا, ذاك, ذيك]
      lexicon:
        - {msa: [هذه], dialect: هذي}
        - {msa: [هؤلاء], dialect: هذولا}
        - {msa: [ذلك], dialect: ذاك}
        - {msa: [تلك], dialect: ذيك}
        - {msa: [ليس, ليست, لسنا], dialect: مو}
        - {msa: [لماذا], dialect: ليش}
        - {msa: [كيف], dialect: شلون}
        - {msa: [ماذا], dialect: شنو}
        - {msa: [أين], dialect: وين}
        - {msa: [الآن], dialect: الحين}
        - {msa: [لأن, لان], dialect: لأن}
        - {msa: [جدا, جداً, كثيرا, كثيراً], dialect: وايد}
        - {msa: [الذي, التي, الذين, اللذان, اللتان], dialect: اللي}
        - {msa: [أريد], dialect: أبي}
        - {msa: [نريد], dialect: نبي}
        - {msa: [يريد], dialect: يبي}
        - {msa: [هناك], dialect: فيه}
        - {msa: [فقط], dialect: بس}
        - {msa: [شيء, شيئا, شيئاً], dialect: شي}
        - {msa: [جيد], dialect: زين}
        - {msa: [نعم], dialect: إي}
        - {msa: [نحن], dialect: احنا}
        - {msa: [يعمل], dialect: يشتغل}
        - {msa: [الكهرباء], dialect: الكهربا}
        - {msa: [هكذا], dialect: جذي}
      patterns:
        - {match: "سوف ", replace: "راح ", note: "future particle -> raah"}
      pronunciation:
        الحين: الْحِين
        وايد: وَايِد
        شلون: شْلُون
        ليش: لِيش
        جذي: چِذِي

