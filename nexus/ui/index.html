<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS Video AI</title>
<style>
:root{--bg:#0c0f17;--panel:#141926;--panel2:#1b2233;--line:#27304a;--text:#e6e9f2;--mute:#8b94ad;--acc:#3ec5ff;--ok:#5fd38a;--warn:#ffb648;--bad:#ff6b81}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;min-height:100vh}
nav{width:232px;flex:none;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto;height:100vh;position:sticky;top:0}
nav h1{font-size:17px;margin:4px 8px 2px;letter-spacing:.06em}
nav .zero{margin:0 8px 12px;color:var(--ok);font-size:12px}
nav h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);margin:14px 8px 4px}
nav a{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:6px;color:var(--text);text-decoration:none;cursor:pointer}
nav a:hover{background:var(--panel2)} nav a.on{background:var(--panel2);color:var(--acc)}
nav a small{color:var(--mute);font-size:10px;align-self:center}
main{flex:1;min-width:0;padding:22px 28px 60px;max-width:1280px}
h2.page{font-size:22px;margin:0 0 4px} p.lead{color:var(--mute);margin:0 0 18px;max-width:75ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.card.click{cursor:pointer} .card.click:hover{border-color:var(--acc)}
.card h3{margin:0 0 4px;font-size:15px} .card p{margin:0;color:var(--mute);font-size:13px}
.stat b{display:block;font-size:24px;font-variant-numeric:tabular-nums} .stat span{color:var(--mute);font-size:12px}
table{border-collapse:collapse;width:100%;font-size:13px} th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:500;font-size:12px} .scroll{overflow-x:auto}
input,select,textarea,button{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:7px 9px}
textarea{width:100%;min-height:70px} input[type=text],input:not([type]){width:100%}
button{cursor:pointer;background:#1f6feb;border-color:#1f6feb;color:#fff} button.sec{background:var(--panel2);border-color:var(--line);color:var(--text)}
button:disabled{opacity:.5;cursor:default} button.sm{padding:3px 7px;font-size:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:10px 0} .row>label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute);flex:1;min-width:140px}
.tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.tag.ok{color:var(--ok);border-color:var(--ok)} .tag.warn{color:var(--warn);border-color:var(--warn)} .tag.bad{color:var(--bad);border-color:var(--bad)}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:340px;font-size:12px;white-space:pre-wrap}
video{width:100%;max-height:420px;background:#000;border-radius:8px}
.tl{display:flex;height:54px;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:8px 0}
.tl div{border-right:1px solid var(--bg);padding:4px 6px;font-size:11px;overflow:hidden;white-space:nowrap;cursor:pointer;min-width:6px}
.tl div.sel{outline:2px solid var(--acc);outline-offset:-2px}
.tv{background:#28507a}.ti{background:#2f6a4f}.tc{background:#5a4a7a}
.note{border-left:3px solid var(--warn);background:var(--panel);padding:8px 12px;margin:10px 0;color:var(--mute);border-radius:0 8px 8px 0}
h3.sec{margin:22px 0 8px;font-size:15px}
main a{color:var(--acc)}
@media(max-width:820px){body{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px}nav h2{width:100%}main{padding:16px}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main"></main>
<script>
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const api=async(p,body)=>{const r=await fetch(p,body===undefined?{credentials:"same-origin"}:{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json","X-NEXUS-CSRF":"1"},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||r.statusText);return j};
const tag=(t,c="")=>`<span class="tag ${c}">${esc(t)}</span>`;
const statusTag=s=>tag(s,/PASSED|VERIFIED|done|deployed|true|scheduled/i.test(s)?"ok":/BLOCK|fail|REJECT/i.test(s)?"bad":"warn");
const table=(rows,cols)=>!rows||!rows.length?'<p class="lead">Nothing here yet.</p>':`<div class="scroll"><table><tr>${cols.map(c=>`<th>${esc(c[0])}</th>`).join("")}</tr>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</table></div>`;
let mode=localStorage.getItem("nexus-mode")||"beginner", current=null, sel=null, branch="main";
// status: live = wired to the tested backend; partial = part of it works; planned = not built yet
const MODULES=[["Create",[["home","What do you want to create?","live"],["creator","AI Video Creator","live"],["editor","Video Editor","live"],["workspace","Cinematic Workspace","live"],["remix","Video Remix Studio","live"],
 ["animation","Animation & Motion Graphics","live"],["dubbing","Voiceover, Dubbing & Subtitles","live"],["series","Film & Series Studio","live"],["audio","Audio Production","partial"],
 ["enhance","Video Enhancement","planned"],["vfx","VFX Studio","planned"],["documentary","Documentary Studio","partial"]]],
 ["Produce",[["dashboard","Dashboard","live"],["factory","Content Factory","live"],["publishing","Publishing Studio","live"],["review","Review (speakers, translations, cutaways)","live"],["channels","Channels & Business","partial"],
 ["research","Content Research & Trends","planned"],["analytics","Analytics","planned"]]],
 ["System",[["projects","Project History","live"],["qa","Quality Assurance Center","live"],["assets","Asset Library","live"],["resources","Free Resources & Compute","live"],["storage","Storage & Backup","live"],
 ["tools","Deployed Tools & Models","live"],["models","Generation & Vision Models","live"],["discovery","GitHub Discovery","live"],["plugins","Plugin Manager","planned"],["settings","Settings","live"]]]];
const PLANNED={enhance:"Upscaling, interpolation and stabilisation controls. FFmpeg's stabiliser is installed but not exposed here yet; Real-ESRGAN/RIFE need a GPU worker.",
 vfx:"Masks, keying and compositing. Not built. Candidates: SAM 2 (GPU) and rembg (CPU).",research:"Trend and competitor research. Not built: needs platform analytics access that you authorise. Wikipedia-based topic research already runs inside the AI Video Creator.",
 analytics:"Performance analytics from YouTube/TikTok/Instagram. Not built: requires your own OAuth authorisation for each platform's official API.",plugins:"Third-party plugin loading. Not built."};
function nav(){ $("#nav").innerHTML=`<h1>NEXUS VIDEO AI</h1><div class="zero" id="spend">spend: $0.00</div><a href="/studio" style="display:block;margin:6px 0 10px">Open Remote Studio (cloud) →</a>`+MODULES.map(([g,items])=>`<h2>${g}</h2>`+items.map(([id,name,st])=>`<a data-id="${id}" class="${id===current?"on":""}">${esc(name)}${st==="live"?"":`<small>${st}</small>`}</a>`).join("")).join("");
  document.querySelectorAll("nav a").forEach(a=>a.onclick=()=>go(a.dataset.id));
  api("/api/spend").then(s=>$("#spend").textContent=`spend: $${s.actual_spend_usd.toFixed(2)} · ${s.decisions.block||0} paid ops blocked`).catch(()=>{}) }
function go(id,arg){current=id;nav();const m=$("#main");m.innerHTML="<p class='lead'>Loading…</p>";(PAGES[id]||planned)(m,arg,id).catch(e=>m.innerHTML=`<div class="note">Error: ${esc(e.message)}</div>`)}
async function planned(m,_,id){const n=MODULES.flatMap(g=>g[1]).find(x=>x[0]===id);m.innerHTML=`<h2 class="page">${esc(n[1])}</h2><div class="note"><b>Not built yet.</b> ${esc(PLANNED[id]||"")}</div>`}
async function jobsBlock(){const j=await api("/api/jobs");return `<h3 class="sec">Jobs</h3>`+table(j.slice(0,12),[["Job",r=>esc(r.kind)],["Status",r=>statusTag(r.status)+(r.retries?` <span style="color:var(--mute);font-size:12px">resumed ×${r.retries}</span>`:"")],["Stage",r=>(r.stages||[]).map(s=>`<span title="${esc(s.name)}${s.seconds?" · "+s.seconds+" s":""}" style="color:var(--${s.status==="done"?"ok":"mute"})">${s.status==="done"?"●":"○"}</span>`).join(" ")+(r.status==="running"&&r.stage?" "+esc(r.stage):"")],["Project",r=>r.project_id||r.result?.project?`<a href="#" onclick="go('editor','${r.project_id||r.result.project}');return false">${esc(r.project_id||r.result.project)}</a>`:""],
 ["Result",r=>r.error&&r.status!=="done"&&r.status!=="queued"&&r.status!=="running"?`<span style="color:var(--bad)">${esc(r.error.split("\n")[0])}</span>`+(r.recovery?`<div style="color:var(--mute);font-size:12px">${esc(r.recovery)}</div>`:"")+(r.durable?` <button class="sm" onclick="api('/api/jobs/${r.id}/retry',{}).then(()=>go(current))">Resume</button>`:""):r.recovery&&r.status!=="done"?`<span style="color:var(--mute)">${esc(r.recovery)}</span>`:r.result?.status?statusTag(r.result.status)+" "+esc((r.result.issues||[]).length+" issue(s)"):esc(r.result?JSON.stringify(r.result).slice(0,90):"")],
 ["Time",r=>r.finished&&r.started?Math.round(r.finished-r.started)+" s":""]])}
async function dlModel(id,gb){const p=await api(`/api/models/${id}/plan`);
 if(!confirm(`Download ${p.name}: ${p.total_gb} GB.\nWeights licence: ${(p.licence&&p.licence.weights_licence)||"see catalogue"}.\nDo you accept the licence and the download?`))return;
 try{await api(`/api/models/${id}/download`,{accepted_gb:p.total_gb,licence_accepted:true});go("models")}catch(e){alert(e.message)}}
function poll(el){const t=setInterval(async()=>{if(!document.body.contains(el))return clearInterval(t);el.innerHTML=await jobsBlock()},4000);jobsBlock().then(h=>el.innerHTML=h)}
// ---- disk + archive panels (Storage page)
const GB=b=>b<1073741824?(b/1048576).toFixed(1)+" MB":(b/1073741824).toFixed(2)+" GB";
async function diskPanel(el){const r=await api("/api/disk");const st=r.status,u=r.usage,c=u.categories,a=r.archive||{};
 const lab={render_cache:"Render cache (segments, pieces)",media_cache:"Media cache (proxies, thumbnails, generated)",temporary:"Temporary + render work",project_sources:"Project source media",renders:"Final renders + exports",project_other:"Timelines, reports",archive_local:"Archive metadata + thumbnails",assets:"Asset library",models:"Models",benchmarks:"Benchmark media",logs:"Logs",backups:"Backups",database:"Database"};
 el.innerHTML=`<div class="note" style="border-color:${st.level==="ok"?"var(--ok)":st.level==="warning"?"var(--warn)":"var(--bad)"}"><b>${esc(st.level.toUpperCase())}</b> · ${st.free_gb} GB free on ${esc(u.disk.path)} · ${r.active_renders} render(s) running<br>${st.messages.map(esc).join("<br>")}</div>
 ${table(Object.entries(c).sort((x,y)=>y[1].bytes-x[1].bytes),[["Category",x=>esc(lab[x[0]]||x[0])],["Size",x=>GB(x[1].bytes)],["Files",x=>x[1].files]])}
 <p class="lead">Local final videos waiting for (or kept after) archiving: ${GB(a.local_bytes||0)} · archived externally: ${GB(a.archived_bytes||0)}${a.destination&&a.destination.usage&&a.destination.usage.limit?` · destination ${GB(a.destination.usage.used||0)} of ${GB(a.destination.usage.limit)} used`:""}</p>
 <div class="row"><label>Warn below (GB)<input id="dsw" type="number" value="${st.settings.warn_free_gb}"></label><label>Never go below (GB)<input id="dsm" type="number" value="${st.settings.min_free_gb}"></label><label>Cache quota (GB)<input id="dsc" type="number" value="${st.settings.cache_quota_gb}"></label><label>Asset quota (GB)<input id="dsa" type="number" value="${st.settings.asset_cache_quota_gb}"></label><button class="sec sm" id="dss">Save limits</button></div>
 <div class="row"><button class="sm" id="dsp">Show what can be cleaned</button></div><div id="dsplan"></div>`;
 $("#dss").onclick=async()=>{try{await api("/api/disk/settings",{settings:{warn_free_gb:+$("#dsw").value,min_free_gb:+$("#dsm").value,cache_quota_gb:+$("#dsc").value,asset_cache_quota_gb:+$("#dsa").value}});diskPanel(el)}catch(e){alert(e.message)}};
 $("#dsp").onclick=async()=>{const p=await api("/api/disk/cleanup",{});$("#dsplan").innerHTML=`<p class="lead">${p.items.length} file(s), ${GB(p.bytes)} can be removed safely. Never touched: source media, final videos without a verified archive copy, files any timeline uses, active renders, models, backups, secrets. ${p.protected_skipped_count} protected file(s) were skipped.</p>
  ${table(Object.entries(p.by_rule),[["Rule",x=>esc(x[0])],["Size",x=>GB(x[1])]])}${table(p.items.slice(0,40),[["File",x=>esc(x.path.split(/[\\/]/).slice(-2).join("/"))],["Why",x=>esc(x.reason)],["Size",x=>(x.bytes/1048576).toFixed(1)+" MB"]])}
  ${p.items.length?`<button class="sm" id="dsx">Delete exactly these ${p.items.length} files</button>`:""}`;
  const x=$("#dsx");if(x)x.onclick=async()=>{try{const r=await api("/api/disk/cleanup",{plan_id:p.plan_id});alert(`Deleted ${r.deleted} files, freed ${GB(r.freed_bytes)}`+(r.errors.length?`; ${r.errors.length} refused`:""));diskPanel(el)}catch(e){alert(e.message)}}}}
async function archivePanel(el,pid){const r=await api("/api/archive"+(pid?`?project=${pid}`:""));const d=r.summary.destination||{};
 el.innerHTML=`<p class="lead">Destination: ${d.name?esc(d.detail):`<b>none</b> - ${esc(d.detail||"")}`}. Final videos are uploaded through the storage layer, verified by checksum, and only then removed from this disk. Archived videos are never deleted automatically.</p>
 ${table(r.deliverables,[["",x=>x.thumbnail?`<img src="/api/archive/thumb/${x.id}" style="width:96px;border-radius:3px">`:""],["Video",x=>esc(x.name)+`<br><small style="color:var(--mute)">${esc(x.project_id||"")}</small>`],["State",x=>statusTag(x.state)+(x.error?`<div style="color:var(--bad);font-size:12px">${esc(x.error)}</div>`:"")],
  ["Size",x=>(x.size/1048576).toFixed(1)+" MB"],["Checked by",x=>esc((x.verification||{}).method||"-")],["Where",x=>esc(x.remote?(x.remote.connection_id+": "+(x.remote.path||x.remote.ref)):"-")],["Local copy",x=>x.local_exists?"yes":"no"],
  ["",x=>x.remote&&!x.local_exists?`<button class="sec sm" data-ret="${x.id}">Download back</button>`:""]])}
 <div class="row"><button class="sec sm" id="arr">Retry pending uploads</button></div><div id="arjobs"></div>`;
 el.querySelectorAll("[data-ret]").forEach(b=>b.onclick=async()=>{await api("/api/archive/retrieve",{record:b.dataset.ret});poll($("#arjobs"))});
 $("#arr").onclick=async()=>{await api("/api/archive/retry",{});poll($("#arjobs"))}}
const PAGES={
async home(m){const C=[["creator","Create a video from an idea","Research, script, licensed visuals, narration, music, captions."],["series","Create a cinematic film plan","Logline, characters, scenes and a shot list."],
 ["series","Create an episodic series","Series bible, season plan, continuity-checked episodes."],["creator","Create a documentary","Source-cited narration over licensed archive images."],
 ["animation","Create an animated explainer","Manim diagrams, data graphics, 3D titles."],["editor","Edit an existing video","Upload, analyse, get an edit proposal, refine on the timeline."],
 ["remix","Remix multiple videos","Combine sources into a new story in three versions."],["dubbing","Translate and dub a video","Arabic (MSA + Egyptian), German, English."],
 ["projects","Continue an existing project","Reopen any project with its style and history."],["factory","Create five daily videos","Capacity plan and schedule from measured speed."],
 ["channels","Build a content channel","Niche, pillars, calendar, revenue ledger."],["research","Research content opportunities","Planned."]];
 m.innerHTML=`<h2 class="page">What do you want to create?</h2><p class="lead">Everything runs on this computer with free, open tools. No paid API can be called: the Cost Guard blocks it.</p><div class="grid">${C.map(c=>`<div class="card click" onclick="go('${c[0]}')"><h3>${c[1]}</h3><p>${c[2]}</p></div>`).join("")}</div><div id="jobs"></div>`;poll($("#jobs"))},
async dashboard(m){const d=await api("/api/dashboard");const hw=d.hardware;const st=(v,l)=>`<div class="card stat"><b>${v}</b><span>${l}</span></div>`;
 m.innerHTML=`<h2 class="page">Dashboard</h2><p class="lead">Measured on this machine. Money spent is always zero because anything that could cost money is refused before it runs.</p>
 <div class="grid">${st("$"+d.spend.actual_spend_usd.toFixed(2),"actual money spent")}${st(d.spend.decisions.block||0,"paid / undeclared operations blocked")}${st(d.projects,"projects")}${st(d.qa.renders_reviewed,"renders reviewed by QA")}
 ${st(Math.round(d.qa.first_pass_rate*100)+"%","passed automated QA")}${st(d.cpu_seconds_in_ffmpeg+" s","CPU time in FFmpeg")}${st("0 s","GPU time used")}${st(hw.ram_free_gb+" / "+hw.ram_gb+" GB","RAM free")}${st(hw.disk_free_gb+" GB","disk free")}</div>
 <h3 class="sec">Hardware</h3><p>${esc(hw.cpu)} · ${hw.threads} threads · GPU: ${hw.gpu?esc(hw.gpu.name):"none"} · acceleration: ${esc(hw.acceleration)}</p>
 <h3 class="sec">Measured throughput</h3>${table(Object.entries(d.throughput),[["Metric",r=>esc(r[0])],["Value",r=>r[1].value],["Source",r=>r[1].measured?tag("measured","ok"):tag("default, not measured","warn")]])}<div id="jobs"></div>`;poll($("#jobs"))},
async creator(m){api("/api/presets").then(ps=>{const e=$("#preset");if(e)e.innerHTML+=ps.map(x=>`<option value="${x.id}">${esc(x.label)}</option>`).join("")}).catch(()=>{});m.innerHTML=`<h2 class="page">AI Video Creator</h2><p class="lead">From a topic to a finished, reviewed video. Research comes from Wikipedia (cited), visuals from Wikimedia Commons with licence records, narration from Piper, script from a local LLM. Takes roughly 5–10 minutes.</p>
 <div class="row"><label>Topic or idea<input id="topic" placeholder="How vaccines train the immune system"></label><label style="max-width:110px">Scenes<input id="scenes" type="number" value="5" min="3" max="10"></label>
 <label style="max-width:190px">Style<select id="preset"><option value="">(default)</option></select></label>
 <label style="max-width:150px">Format<select id="vert"><option value="">16:9 landscape</option><option value="1">9:16 vertical</option></select></label></div>
 ${mode!=="beginner"?`<label style="color:var(--mute);font-size:12px">Your own research notes (optional; used as the fact source)<textarea id="notes"></textarea></label>`:""}
 <div class="row"><button id="go">Create video</button></div><div class="note">The script is checked against the research text (numbers and claims must be traceable). You still need to watch the result before publishing.</div><div id="jobs"></div>`;
 $("#go").onclick=async()=>{if(!$("#topic").value.trim())return;await api("/api/create",{topic:$("#topic").value,scenes:+$("#scenes").value,vertical:!!$("#vert").value,preset:$("#preset").value||null,notes:$("#notes")?.value||null});poll($("#jobs"))};poll($("#jobs"))},
async projects(m){const p=await api("/api/projects");m.innerHTML=`<h2 class="page">Project History</h2><p class="lead">Originals are never modified. Every edit is a saved version you can return to.</p>`+table(p,[["Project",r=>`<a href="#" onclick="go('editor','${r.id}');return false">${esc(r.name)}</a>`],["Type",r=>tag(r.kind)],["Created",r=>new Date(r.created*1000).toLocaleString()]])},
async editor(m,pid){ if(!pid){m.innerHTML=`<h2 class="page">Video Editor</h2><p class="lead">Upload a video you own or are authorised to use. NEXUS analyses it and proposes an edit before changing anything.</p>
  <div class="row"><input type="file" id="f" accept="video/*,audio/*"><button id="up">Upload and analyse</button></div><div id="jobs"></div><h3 class="sec">Or open a project</h3><div id="pl"></div>`;
  $("#up").onclick=async()=>{const f=$("#f").files[0];if(!f)return;const fd=new FormData();fd.append("file",f);$("#up").disabled=true;const r=await(await fetch("/api/upload",{method:"POST",body:fd})).json();go("editor",r.project)};
  poll($("#jobs"));const p=await api("/api/projects");$("#pl").innerHTML=table(p.slice(0,15),[["Project",r=>`<a href="#" onclick="go('editor','${r.id}');return false">${esc(r.name)}</a>`],["Type",r=>tag(r.kind)]]);return}
 const p=await api(`/api/projects/${pid}?branch=${encodeURIComponent(branch)}`).catch(async()=>{branch="main";return api(`/api/projects/${pid}`)});const tl=p.timeline;const an=Object.values(p.analysis)[0];
 const last=p.renders[p.renders.length-1];const rep=p.reports[p.reports.length-1];
 let h=`<h2 class="page">${esc(p.name)}</h2><p class="lead">${tag(p.kind)} ${Object.keys(p.history).map(b=>`<a href="#" onclick="branch='${b}';go('editor','${pid}');return false">${tag(b,b===branch?"ok":"")}</a>`).join(" ")}</p>`;
 if(an)h+=`<h3 class="sec">Source analysis</h3><p>${an.duration.toFixed(1)} s · ${an.scenes.length} shots · ${an.silences.length} pauses · ${an.repetitions.length} repeated takes · loudness ${an.loudness?an.loudness.lufs+" LUFS":"n/a"} ${an.issues.map(i=>tag(i,"warn")).join(" ")}</p><p class="lead">Not available yet: ${esc(an.not_available.join("; "))}</p>${mode!=="beginner"?`<pre>${esc(an.text||"")}</pre>`:""}`;
 else if(p.media.length&&!tl)h+=`<div class="note">Analysis is still running…</div>`;
 if(an&&!tl){h+=`<h3 class="sec">Editing proposal</h3><div class="row"><label>Goal<select id="goal"><option value="tighten">Tighten (remove pauses and retakes)</option><option value="highlights">Highlights cut</option></select></label>
  <label>Target length (s, optional)<input id="td" type="number"></label><label>Look<select id="grade"><option>cinematic</option><option>documentary</option><option>warm</option><option>cool</option><option>vivid</option><option>bw</option><option>none</option></select></label>
  <label>Opening title (optional)<input id="title"></label><button id="prop">Propose edit</button></div><div id="propout"></div>`}
 if(an){h+=`<h3 class="sec">Director: edit this footage</h3><p class="lead">NEXUS reads the whole transcript, finds the strongest opening, removes pauses, fillers, retakes and tangents, and cuts at sentence boundaries to your target length. Every kept and dropped passage is listed with its reason. The result is an editable timeline.</p>
  <div class="row"><label>Style<select id="dprof"></select></label><label>Target length (s)<input id="dtgt" type="number" placeholder="e.g. 90"></label>
  <label>Aspect<select id="dsize"><option value="1920x1080">16:9 (YouTube)</option><option value="1080x1920">9:16 (Shorts/Reels/TikTok)</option><option value="1080x1080">1:1</option><option value="1080x1350">4:5</option></select></label>

async workspace(m,pid){

 const tl=p.timeline;if(!tl){m.innerHTML=`<h2 class="page">${esc(p.name)}</h2><div class="note">This project has no timeline yet. Build one in the Video Editor or the Director first.</div>`;return}
 const hist=p.history[branch]||{versions:[],head:-1};const renders=p.renders||[];const last=renders[renders.length-1];const rep=(p.reports||[])[(p.reports||[]).length-1];

 $("#bk").onclick=async()=>{await api("/api/backup",{drill:true});poll($("#jobs"))};poll($("#jobs"));diskPanel($("#dsk"));archivePanel($("#arc"))},
async tools(m){const t=await api("/api/tools");m.innerHTML=`<h2 class="page">Deployed Tools & Models</h2><p class="lead">What is really installed on this machine, with versions and licences.</p>`+
 table(t.components,[["Component",r=>`<a href="${esc(r.source_url)}" target="_blank" rel="noopener">${esc(r.name)}</a>`],["Status",r=>statusTag(r.status)],["Health",r=>r.healthy===true?tag("ok","ok"):r.healthy===false?tag("broken","bad"):tag("untested","warn")],["Version",r=>esc(r.version)],["Licence",r=>esc(r.license)+(r.weights_license?`<br><small style="color:var(--mute)">weights: ${esc(r.weights_license)}</small>`:"")],["Cost",r=>"$"+r.cost_usd]])+
 `<h3 class="sec">Downloaded models</h3>`+table(Object.entries(t.models),[["Model",r=>esc(r[0])],["Repository",r=>esc(r[1].repo)],["Revision",r=>esc((r[1].revision||"").slice(0,10))],["Licence",r=>esc(r[1].license)],["Downloaded",r=>esc(r[1].downloaded)]])},
async discovery(m){const c=await api("/api/catalog");const cls=[...new Set(c.map(r=>r.class))];m.innerHTML=`<h2 class="page">GitHub Discovery</h2><p class="lead">${c.length} projects and services evaluated. Licence classes are kept apart. “Deployed” means installed and tested here.</p>
 <div class="row"><label>Decision<select id="fd"><option value="">all</option><option>DEPLOYED</option><option>NEXT</option><option>CANDIDATE</option><option>REJECTED</option></select></label><label>Licence class<select id="fc"><option value="">all</option>${cls.map(x=>`<option>${x}</option>`).join("")}</select></label><button class="sec" id="evo">Run evolution check</button></div><div id="cat"></div><div id="jobs"></div>`;
 const draw=()=>{const d=$("#fd").value,k=$("#fc").value;$("#cat").innerHTML=table(c.filter(r=>(!d||r.decision===d)&&(!k||r.class===k)),[["Area",r=>esc(r.category)],["Project",r=>r.repo.includes("/")&&!r.repo.startsWith("http")&&!r.repo.includes(" ")?`<a href="https://github.com/${esc(r.repo)}" target="_blank" rel="noopener">${esc(r.name)}</a>`:esc(r.name)],
  ["Licence",r=>esc(r.license)+(r.weights_license?`<br><small style="color:var(--mute)">${esc(r.weights_license)}</small>`:"")],["Class",r=>tag(r.class,r.class==="FOSS"?"ok":r.class==="EXCLUDED-PAID"?"bad":"warn")],["Last push",r=>esc(r.pushed)+(r.archived==="true"?" "+tag("archived","bad"):"")],["Decision",r=>statusTag(r.decision)],["Why",r=>esc(r.reason)]])};
 $("#fd").onchange=draw;$("#fc").onchange=draw;draw();$("#evo").onclick=async()=>{await api("/api/evolution/check",{});poll($("#jobs"))}},

 <p class="lead">Beginner hides transcripts, research notes and technical detail. Stored in this browser only.</p>`;$("#mode").value=mode;$("#mode").onchange=e=>{mode=e.target.value;localStorage.setItem("nexus-mode",mode)}}
