# Audio tools, defaults and licences (Account 2, Agent C). Evidence: docs/results/a2_denoise_compare.json,
# docs/results/a2_audio_bench.json, docs/results/a2_audio_acceptance.json. Licences read 2026-11-12.
# Entries the lead may want to mirror in components.yaml (owned by the lead) are marked components: request.
tools:
  - id: ffmpeg-audio-filters
    what: afftdn, afwtdn, anlmdn, arnndn, adeclip, deesser, bandreject, equalizer, acompressor, alimiter, ebur128
    licence: LGPL-2.1+ (FFmpeg build in use; GPL parts not needed for these filters)
    cost: zero, local
  - id: rnnoise-models
    what: RNNoise model 'somnolent-hogwash' (sh.rnnn, 298 KB) for arnndn
    licence: "RNNoise BSD-3-Clause; model author states the models are not creative works, not subject to copyright"
    source: raw.githubusercontent.com/GregorR/rnnoise-models (existing component, downloaded on first use)
  - id: noisereduce
    what: spectral gating noise reduction, noisereduce 3.0.3 (Tim Sainburg)
    licence: MIT (PyPI metadata; LICENSE file)
    install: "optional, opt-in: pip install noisereduce==3.0.3 (22 KB wheel + joblib, tqdm, cloudpickle ~3.5 MB). Never installed automatically."
    components: request
  - id: wespeaker
    what: speaker embeddings used by measure.speaker_levels (existing diarisation component)
    licence: CC BY 4.0 (weights), attribution WeSpeaker / wenet-e2e
  - id: deepfilternet
    status: rejected
    why: "code MIT/Apache-2.0, but needs PyTorch (CPU wheel 210 MB download, 753 MB unpacked), pins numpy<2 (venv has 2.5 on Python 3.13), no cp313 DeepFilterLib wheel (Rust build), weights hosted on GitHub (not an approved model host)"
  - id: wpe-numpy
    what: weighted prediction error dereverberation, own numpy implementation (nexus/audio/dialogue.py)
    licence: project code
  - id: procedural-sfx-ambience-music
    what: nexus/fx/sfx.py, nexus/audio/design.py ambience beds, nexus/audio/music.py beds
    licence: generated by project code from oscillators/noise; no recordings
denoise_defaults:        # material class -> tool, strength (nexus/audio/denoise.py MATERIAL_DEFAULTS)
  studio: [none, "-"]
  interview: [arnndn, light]
  panel: [arnndn, light]
  podcast: [arnndn, light]
  outdoor: [arnndn, normal]
  documentary: [noisereduce, light]
  archival: [noisereduce, normal]
  fallback_when_missing: [afftdn, light]
  guard: "speech band (300-3400 Hz, loudest 30 % of blocks) may move by at most 1.5 dB, else the next safer tool is used"
loudness:
  dialogue_master_lufs: -16.0
  programme_lufs: -14.0      # renderer target_lufs default
  true_peak_dbtp: -1.5
qa:
  sync_target_ms: "one frame (1000/fps)"
  sync_major_ms: {late: 125, early: 45}   # ITU-R BT.1359 detectability
  level_jump_db: 6.0
  gap_digital_silence_s: 0.25
  dead_air_s: 3.0
sfx_density:             # nexus/audio/design.py PROFILES
  documentary: {per_min: 2, spacing_s: 12}
  corporate: {per_min: 3, spacing_s: 8}
  cinematic: {per_min: 4, spacing_s: 6}
  energetic: {per_min: 6, spacing_s: 4}
