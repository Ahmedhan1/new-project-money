# Platform knowledge base (PLAT-1). Loaded by nexus/platforms.py; publish.PLATFORMS is derived from it.
#
# READ THIS FIRST
# - Recommendation / ranking systems are NOT public, are personalised per viewer and change without notice. Nothing in this
#   file is "the algorithm". `signals` only encode what a platform ITSELF has said publicly, each with its source and the date
#   it was read. Anything that is not such a statement is labelled `confidence: editorial-rule-of-thumb`.
# - confidence levels: official-statement (the platform says so in its own help/blog/newsroom), official-guideline (a
#   platform rule or creator guideline), editorial-rule-of-thumb (common practice or model knowledge, not a platform claim).
# - `verified_via`: how the source was checked. The build sandbox (2026-11-12) could not open platform hosts directly, so the
#   official pages below were located and their wording checked through web-search excerpts of the official page; the page
#   itself was not fetched. Entries whose official page could not be located say `source: unverified (from model knowledge, <year>)`.
# - Specs (limits, sizes) change often. `spec_confidence` says how sure we are; check the platform's upload page before relying
#   on a hard limit. Durations are seconds; safe zones are fractions of the frame kept free of platform UI
#   (top/bottom/left/right); loudness is an integrated LUFS target for our master, not a platform requirement unless sourced.
# - NEXUS never uploads, scrapes or downloads; it prepares manual upload packages. Nothing here is meant to evade detection:
#   the originality signals are why NEXUS asks for rights and real transformation (see docs/PHASE3_PLAN.md boundary).

read_on_default: "2026-11-12"

platforms:
  youtube:
    label: YouTube (long-form)
    kind: long
    aspect: ["16:9"]
    size: [1920, 1080]
    fit: contain
    min_s: 1
    max_s: 43200            # 12 h for verified accounts; 15 min for unverified accounts
    ideal_s: [240, 1200]    # editorial
    file_max_mb: 262144
    title_max: 100
    desc_max: 5000
    hashtags: 3             # YouTube shows up to 3 hashtags above the title
    hashtag_max: 15
    safe_zone: {top: 0.0, bottom: 0.10, left: 0.0, right: 0.0}
    loudness_lufs: -14
    captions: {style: classic, position: bottom}
    captions_required: false
    title_card: keep        # keep / short / remove
    title_card_max_s: 2.5
    progress_bar: false
    hook_s: 5.0             # first speech should start within this many seconds (editorial)
    end: end-card           # leave the closing seconds for YouTube end-screen elements (added in YouTube Studio)
    end_card_s: [5, 20]
    chapters: true
    spec_confidence: editorial-rule-of-thumb
    spec_sources: ["unverified (from model knowledge, 2025): YouTube Help upload limits, title 100 chars, description 5000 bytes, end screens 5-20 s, chapters need >=3 chapters of >=10 s starting at 0:00"]
    signals:
      - id: yt-satisfaction
        claim: "The recommendation system uses signals such as clicks, watch time, survey responses, sharing, likes and dislikes, aiming at viewer satisfaction rather than raw watch time."
        source: {title: "On YouTube's recommendation system (YouTube Official Blog)", url: "https://blog.youtube/inside-youtube/on-youtubes-recommendation-system/"}
        read_on: "2026-11-12"
        verified_via: search-result excerpt of the official page
        confidence: official-statement
        implication: "Master is condensed (fillers, pauses, retakes and low-importance sentences removed) so time watched is time valued; chapters and honest titles, no clickbait the video does not deliver."
      - id: yt-valued-watchtime
        claim: "Only watch time on videos viewers rate highly in surveys (4-5 stars) counts as 'valued watchtime'; a model predicts survey responses for everyone."
        source: {title: "On YouTube's recommendation system (YouTube Official Blog)", url: "https://blog.youtube/inside-youtube/on-youtubes-recommendation-system/"}
        read_on: "2026-11-12"
        verified_via: search-result excerpt of the official page
        confidence: official-statement
        implication: "Director keeps the substance (importance + redundancy scoring) instead of padding length; QA reports pacing, never predicts views."
      - id: yt-how-recommendations-work
        claim: "YouTube publishes an overview of how recommendations work (personalised, based on watch history and engagement signals)."
        source: {title: "How YouTube Works: Recommendations", url: "https://www.youtube.com/howyoutubeworks/product-features/recommendations"}
        read_on: "2026-11-12"
        verified_via: search-result listing of the official page
        confidence: official-statement
        implication: "One clear topic per video and accurate metadata (title/description/chapters) so the video can be matched to the right viewers."
      - id: yt-recsys-help
        claim: "YouTube Help documents its recommendation system and the notion of valued watch time."
        source: {title: "YouTube's Recommendation System (YouTube Help)", url: "https://support.google.com/youtube/answer/16533387"}
        read_on: "2026-11-12"
        verified_via: search-result excerpt of the official page
        confidence: official-statement
        implication: "Same as yt-satisfaction; NEXUS never optimises length for its own sake."
      - id: yt-ctr-thumbnail
        claim: "Click-through on title and thumbnail matters, but only together with satisfaction after the click."
        source: "unverified (from model knowledge, 2024)"
        read_on: "2026-11-12"
        confidence: editorial-rule-of-thumb
        implication: "Package writes a readable thumbnail with the title; title variants come from the content, not invented claims."

  shorts:
    label: YouTube Shorts
    kind: short
    aspect: ["9:16", "1:1"]
    size: [1080, 1920]
    fit: blur
    min_s: 1
    max_s: 180
    ideal_s: [20, 60]
    file_max_mb: 262144
    title_max: 100
    desc_max: 5000
    hashtags: 3
    hashtag_max: 15
    safe_zone: {top: 0.10, bottom: 0.22, left: 0.04, right: 0.15}
    loudness_lufs: -14
    captions: {style: pop, position: middle, words_per_cue: 3, uppercase: true, highlight: "#FFD400"}
    captions_required: true
    title_card: remove
    title_card_max_s: 0
    progress_bar: false     # Shorts loop; the player has its own progress line
    hook_s: 1.5
    end: loop
    spec_confidence: official-guideline
    spec_sources:
      - "Shorts up to 3 minutes for square or taller videos from 2024-10-15: announced on the YouTube Official Blog 2024-10-03 (official post not reachable; confirmed via coverage, e.g. https://petapixel.com/2024/10/04/youtube-shorts-expands-video-length-to-three-minutes/)"
    signals:
      - id: shorts-viewed-vs-swiped
        claim: "YouTube Studio reports 'Viewed vs. swiped away' for Shorts in the feed: the share of viewers who chose to watch rather than swipe."
        source: "unverified (from model knowledge, 2024; official YouTube Help page not located from this sandbox)"
        read_on: "2026-11-12"
        confidence: editorial-rule-of-thumb
        implication: "First second must carry a visual + a caption: no title card, no fade from black, speech within 1.5 s."
      - id: shorts-view-counting-2025
        claim: "Since March 2025 a Shorts view is counted when it starts to play or replays; 'engaged views' keep the older, stricter count."
        source: "unverified (from model knowledge, 2025; reported by YouTube in Studio/Help, page not located from this sandbox)"
        read_on: "2026-11-12"
        confidence: editorial-rule-of-thumb
        implication: "NEXUS reports durations and structure, never view predictions; engaged viewing is served by the hook rules."
      - id: shorts-satisfaction
        claim: "The same satisfaction-oriented signals (likes, shares, surveys, watching vs skipping) apply to Shorts recommendations."
        source: {title: "On YouTube's recommendation system (YouTube Official Blog)", url: "https://blog.youtube/inside-youtube/on-youtubes-recommendation-system/"}
        read_on: "2026-11-12"
        verified_via: search-result excerpt of the official page
        confidence: official-statement
        implication: "Shorts are built from complete thoughts (whole sentences) with a concluding line, not cut mid-sentence."
      - id: shorts-loop
        claim: "Short vertical videos that end cleanly into their own start are rewatched more often."
        source: "unverified (editorial practice, 2024)"
        read_on: "2026-11-12"
        confidence: editorial-rule-of-thumb
        implication: "No fade-out to black at the end of short-form cuts so the loop is seamless."

