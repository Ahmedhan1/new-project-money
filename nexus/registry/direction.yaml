# Creative-direction profiles for nexus/director.py (WS B, DIR-1).
# Each profile is a set of MEASURABLE editing parameters. They are NEXUS's own creative profiles, written from general
# editing practice; they make no claim of equivalence to any studio, broadcaster or named editor.
#
# Fields (seconds unless stated):
#   shot_len: [min, max]        target length of a visible shot; longer stretches get a cutaway or a punch-in reframe
#   pacing: steady|build|front_loaded|wave   how the shot-length target varies over the programme
#   pause_tolerance             longest pause kept inside speech; longer ones become jump cuts
#   filler_removal 0..1         0 keeps every filler; >=0.3 removes um/uh; >=0.6 also "you know"/"I mean"; >=0.9 also loose fillers
#   drop_tangents               drop topics classified as tangents
#   opening: cold_open|hook_first|title_first   cold_open = strongest self-contained line, then the title card
#   ending: resolution|callback|end_card|fade_out
#   transitions.vocabulary      cut types the director may use: hard_cut, jump_cut, j_cut, l_cut, crossfade
#   transitions.crossfade_at_topics  crossfades only ever happen at topic boundaries
#   transitions.xfade / dur     FFmpeg xfade name and duration for those crossfades
#   transitions.punch_in        scale used to hide a jump cut (1.0 = do not hide)
#   grade                       a name in timeline/render.GRADES
#   music: {enabled, mood, volume}   mood is a nexus.audio.music mood; volume under ducked dialogue
#   captions                    tl["captions"] (docs/PHASE3_PLAN.md)
#   titles: {card_seconds, lower_thirds, chapters, chapter_text}
#   broll: {policy: none|cutaway, max_talk, min, max}   cutaway = silent/low-speech shots over talking stretches longer than max_talk
#   look                        clip effects applied to every footage clip (contract in docs/PHASE3_PLAN.md)
#   allowed_effects             effect types the director may add
profiles:
  cinematic_story:
    label: Cinematic story
    shot_len: [3.0, 7.0]
    pacing: build
    pause_tolerance: 0.9
    filler_removal: 0.6
    drop_tangents: true
    opening: cold_open
    ending: resolution
    transitions: {vocabulary: [hard_cut, j_cut, l_cut, crossfade], crossfade_at_topics: true, xfade: fadeblack, dur: 0.8, punch_in: 1.0}
    grade: cinematic
    music: {enabled: true, mood: tense, volume: 0.28}
    captions: {style: classic, position: bottom}
    titles: {card_seconds: 3.0, lower_thirds: true, chapters: true, chapter_text: false}
    broll: {policy: cutaway, max_talk: 9.0, min: 2.0, max: 4.5}
    look: [{type: letterbox, ratio: 2.39}, {type: grain, amount: 5}]
    allowed_effects: [letterbox, grain, vignette, zoom]
  commercial:
    label: Commercial / promo
    shot_len: [1.2, 3.0]
    pacing: front_loaded
    pause_tolerance: 0.3
