    source_url: https://github.com/numpy/numpy
    license: BSD-3-Clause
    commercial_use: "yes - audio is synthesised locally, no third-party recording involved"
    usage_restrictions: "simple ambient pads only; not a substitute for composed music"
    hardware: "CPU"
