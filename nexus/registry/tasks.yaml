# NEXUS development task registry - the single source of truth for "what next".
# Statuses: planned | in_progress | implemented | tested | verified | blocked | deferred | rejected
#   implemented = code exists          tested = automated test passes
#   verified    = works in the integrated product, with evidence   (never mark verified without `evidence`)
# Priority: 1 = do first. `python -m nexus tasks` prints the next ready tasks; docs/GAP_ANALYSIS.md maps
# the 40 product domains to these ids.
tasks:
  # ------------------------------------------------------------------ recovery / memory / storage
  - id: MEM-1
    priority: 1
    title: "Project memory files + checkpoint engine (state, handoff, task registry, secret/large-file guard)"
    status: verified
    acceptance: "A fresh session can resume from NEXUS_HANDOFF.md + NEXUS_STATE.json alone; checkpoint refuses secrets/media; never force-pushes."
    test: "pytest tests/fast/test_state.py"
    evidence: "tests/fast/test_state.py passes; this repository's own checkpoints are made with `nexus checkpoint`"
    next: "Keep NEXUS_HANDOFF.md under 1,500 words as the project grows."
  - id: JOB-1
    priority: 1
    title: "Durable job ledger with stage checkpoints, heartbeats, retry and crash recovery"
    status: verified
    acceptance: "Killing the worker mid-job loses nothing; after restart the job finishes and completed stages are not re-run."
    test: "pytest tests/fast/test_jobs.py (kills a real worker process with SIGKILL mid-stage)"
    evidence: "tests/fast/test_jobs.py::test_worker_killed_mid_job_resumes_without_repeating_stages"
    next: "Add job cancellation for running jobs (today only queued jobs can be cancelled)."
  - id: JOB-2
    priority: 2
    title: "Move remaining in-process API jobs onto the durable ledger (analyze, remix, series, film, animate, package)"
    status: tested
    deps: [JOB-1]
    acceptance: "No API endpoint submits a closure; every job kind has a named handler with stages and survives a restart."
    test: "pytest tests/fast/test_jobs.py; real run: POST /api/animate executed by the separate worker process"
    evidence: "api.py has no in-memory queue; series-episode crash test passes; kinetic animation job ran end to end via API + worker process"
    next: "Verify analyze, remix and package handlers with real models (they are covered by heavy tests A, B, G only through the library, not through the job handlers)."
  - id: STO-1
    priority: 1
    title: "Federated storage adapter (local + rclone backends) with zero-spend eligibility and free-allowance caps"
    status: tested
    acceptance: "Backends are interchangeable; a provider that needs a card or can bill is refused; uploads never exceed the free cap."
    test: "pytest tests/fast/test_storage_backup.py"
    evidence: "Local backend and rclone backend (against a local-path remote) pass the same contract test."
    next: "Verify against one real remote (Backblaze B2 or Google Drive) once the user authorises an account - see STO-3."
  - id: STO-2
    priority: 1
    title: "Verified, encrypted, deduplicated snapshot backups + restore into a new directory + restore drill"
    status: verified
    acceptance: "Backup is reported OK only after size+SHA-256 re-read; restore to another directory reopens projects with all references valid; one destination failing does not affect the others."
    test: "pytest tests/fast/test_storage_backup.py"
    evidence: "Acceptance tests D (storage recovery) and E (provider failure) in docs/TEST_REPORT.md"
    next: "Schedule automatic daily backups from the worker (STO-4)."
  - id: STO-3
    priority: 2
    title: "First real off-machine backup destination"
    status: blocked
    deps: [STO-1, STO-2]
    blocked_by: "Needs the user to create/authorise a free account (Backblaze B2 without a card, or Google Drive) and run `rclone config`. Never done by an agent."
    acceptance: "`nexus backup --drill` passes against the remote; usage stays under the free cap."
    test: "nexus backup --to <remote> --drill"
    next: "Ask the user which provider they authorise; follow docs/STORAGE.md \"Add a remote destination\"."
  - id: STO-4
    priority: 3
    title: "Scheduled automatic backups (done) + snapshot pruning policy (open)"
    status: tested
    deps: [STO-2]
    acceptance: "A backup runs daily without user action while the app is running; old snapshots are pruned by policy; failures show in the UI."
    test: "pytest tests/fast/test_jobs.py::test_backups_are_scheduled_automatically"
    evidence: "Worker queues a backup job when the last one is older than settings.backup_every_hours (default 24); test with a shifted clock."
    next: "Call backup.prune(keep=N) after a successful scheduled backup; expose keep-count in settings.json; watch one real overnight run."
  - id: WIN-1
    priority: 1
    title: "One-click Windows launchers (SETUP/START/STOP/STATUS/DOCTOR/BACKUP/RESTORE/CHECKPOINT/RESUME/UPDATE)"
    status: implemented
    acceptance: "On a clean Windows 10/11 machine, double-clicking NEXUS_SETUP then NEXUS_START opens the app; a previous project opens after a reboot."
    test: "Manual on Windows (acceptance test F). The Python launcher under the .bat files is tested on Linux and in CI on windows-latest."
    evidence: "tests/fast/test_launcher.py (start -> health -> previous project -> stop with the real API) passes on Linux and on the windows-latest CI runner; the .bat/.ps1 wrappers themselves have NOT been run on real Windows."
    next: "Run NEXUS_SETUP.bat and NEXUS_START.bat on the user's Windows machine; fix whatever fails (likely llama-cpp-python wheel, espeak-ng, Blender path)."
  - id: WIN-2
    priority: 3
    title: "Packaged Windows app (evaluate Tauri shell vs PyInstaller vs portable Python)"
    status: deferred
    deps: [WIN-1]
    acceptance: "A single installer/portable folder that needs no pre-installed Python."
    test: "Install on a clean VM."
    next: "Only after WIN-1 is verified. Recommended path - portable embedded Python + the existing .bat launchers (see docs/DECISIONS.md D-6)."
  - id: CI-1
    priority: 2
    title: "GitHub Actions CI - lint + fast tests on Linux and Windows, secret scan, no models"
    status: verified
    acceptance: "Every push runs in < 5 min, uses no model downloads, and fails on lint/test/secret problems."
    test: "The workflow run on the pull request."
    evidence: "Run 43111111452 on commit e491f3a - ubuntu-latest and windows-latest both green (Windows ~2 min incl. FFmpeg install). Earlier runs failed on Windows and exposed two file-locking bugs in tests."
    next: "Add pip-audit (SEC-1). Check the account's Actions minutes on the billing page - Windows minutes count double on private repos (K-11)."
  # ------------------------------------------------------------------ verification debt from the previous session
  - id: TST-D
    priority: 1
    title: "Acceptance test D (create-from-idea end to end)"
    status: verified
    acceptance: "tests/test_d_create.py passes and docs/results/D_create.json + frames are committed."
    test: "pytest tests/test_d_create.py"
    evidence: "Passed 2026-11-11 (217 s): 47 s video, 4 two-sentence scenes, 3 licensed images. docs/results/D_create.json, D_frame*.png, D_storyboard.png; history in docs/TEST_REPORT.md"
    next: "Re-run after any change to create.py, assets.py or llm.py."
  - id: TST-F
    priority: 1
    title: "Acceptance test F (film plan + 2 continuity-aware series episodes)"
    status: verified
    deps: [TST-D]
    acceptance: "tests/test_f_series.py passes and docs/results/F_series.json is committed."
    test: "pytest tests/test_f_series.py"
    evidence: "Passed 2026-11-11 (368 s). docs/results/F_series.json, F_ep2_frame.png"
    next: "Re-run after any change to series.py."
  - id: TST-R
    priority: 2
    title: "Quality regression baselines for tests A-I (compare new renders to stored metrics)"
    status: planned
    deps: [TST-D, TST-F]
    acceptance: "A `nexus regress` command re-renders the fixtures and fails if duration/LUFS/QA status drift from docs/results baselines."
    test: "Run twice; second run must pass unchanged."
    next: "Build from the JSON already in docs/results (durations, LUFS, QA checks are stored there)."
  # ------------------------------------------------------------------ output quality (the product's real weakness)
  - id: QLT-1
    priority: 1
    title: "Creative quality pass: measured rubric + series writer on the script schema + research/visual relevance"
    status: in_progress
    deps: [TST-D]
    acceptance: "A reviewer rubric (hook, story arc, visual relevance per scene, no repeated visuals, audio balance) is scored in the QA report and gates approval; series episodes meet the same scene-depth gate as create-from-idea; no scene falls back to a title card when a relevant image exists."
    test: "Render 3 topics + 1 series episode; rubric scores recorded in docs/results; a human watches them."
    evidence: "Done so far - script schema, scene-depth gate, reviewer feedback loop, stock query ladder, sentence-aware subtitles (Test D run 4); series writer gets reviewer feedback + depth gate, episodes request location images (Test F run 2 - scenes 24-31 words, 3 of 8 scenes with images)."
    next: "1) Series visuals - derive the image query from the bible's location LOOK text (generic nouns), not its fictional name, and allow reuse of an image for a repeated location. 2) Repair off-bible locations instead of only reporting them. 3) Research - rank Wikipedia pages by topic overlap (K-4). 4) Scored rubric in the QA report."
  - id: QLT-2
    priority: 2
    title: "Production presets (cinematic, documentary, educational, scientific, commercial, product-ad, storytelling, social, explainer, film/series)"
    status: planned
    acceptance: "A preset sets script style, pacing, grade, music mood, caption style and aspect; selectable in UI and API; each renders a distinct result."
    test: "Render one topic with 3 presets; compare timelines."
    next: "create.produce already takes a `style` dict (grade/mood/music_seed/voice) - extend it into a preset table in registry/presets.yaml."
  - id: QLT-3
    priority: 2
    title: "Targeted scene regeneration (replace one scene's visual/narration without re-rendering the rest)"
    status: planned
    acceptance: "API/UI action \"regenerate scene N\"; only that segment is re-encoded (segment cache proves it); original version kept for comparison."
    test: "segments_from_cache == total-1 after regenerating one scene."
    next: "Timeline versions + per-segment render cache already exist; add an op that swaps a clip's source and re-synthesises its narration."
  - id: QLT-4
    priority: 2
    title: "Repair history + before/after comparison report in QA"
    status: planned
    acceptance: "Every auto-correction stores original render, corrected render and a diff of QA results."
    test: "Force a loudness failure; report shows both versions."
    next: "qa.render_with_qa already records `corrections`; keep the pre-fix render file instead of overwriting it."
  - id: QLT-5
    priority: 3
    title: "Better narration voices (evaluate Kokoro-82M / other Apache-licensed TTS vs Piper) and music (real composition vs synth pads)"
    status: planned
    acceptance: "Blind A/B on 5 sentences per language; replace only if the candidate wins and its licence allows commercial use."
    test: "Benchmark script with recorded results."
    next: "Benchmark Kokoro on CPU first (it is in the research catalog); Arabic voice quality is the weakest of the three languages."
