    windows: "yes (portable build)"
    install: "portable zip or pip; workflows as JSON"
    notes: "Best model coverage and memory tricks (offload, GGUF via custom nodes). Not wired: NEXUS would talk to its local HTTP API; candidate for the GPU tier."
  - id: sdcpp
    licence: MIT
    source_url: https://github.com/leejet/stable-diffusion.cpp
    cpu: "yes (AVX/AVX2/AVX512) - no Python/PyTorch needed; Vulkan backend for any GPU"
    windows: "yes (prebuilt binaries)"
    install: "download a release binary (sd / sd-cli) + a GGUF/safetensors model"
    notes: "Supports SD1.x/2.x, SDXL, FLUX.1/2, Z-Image, Qwen-Image, Wan2.1/2.2, LCM-LoRA, IP-Adapter, PhotoMaker (README read 2026-11-12). Provider implemented (SdCpp), not run here."
  - id: openvino
    licence: Apache-2.0
    source_url: https://github.com/openvinotoolkit/openvino.genai
    cpu: "yes - Intel-optimised (Text2ImagePipeline); integrated Intel GPU/NPU"
    windows: "yes"
    install: "pip install openvino-genai; pre-converted models e.g. OpenVINO/stable-diffusion-v1-5-fp16-ov (CreativeML OpenRAIL-M, 3.35 GB)"
    notes: "Likely the fastest CPU path on an Intel laptop (unmeasured). Not wired; detection only."
  - id: onnxruntime
    licence: MIT
    source_url: https://github.com/microsoft/onnxruntime
    cpu: "yes; DirectML EP on Windows"
    windows: "yes"
    install: "pip install onnxruntime(-directml)"
    notes: "Viable for depth models and Real-ESRGAN; not used for diffusion here."
  - id: gguf-dit
    licence: "per tool"
    source_url: https://github.com/city96/ComfyUI-GGUF
    cpu: "via sd.cpp or ComfyUI-GGUF"
    windows: "yes"
    install: "GGUF-quantised DiT weights (FLUX, Wan, Z-Image) cut VRAM roughly in proportion to bits"
    notes: "Quantisation does not change the licence of the weights."

