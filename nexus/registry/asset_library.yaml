# NEXUS professional asset library (nexus/assetlib). Edited by hand; validated by tests/fast/test_a2_assetlib.py.
#
# kind:
#   builtin    a renderer feature (effect, transition, motion/title preset): nothing to download, always available
#   generated  made on this machine by nexus/assetlib/generators.py (own work, CC0-1.0) when installed
#   download   fetched on demand from `url`, checked against the pinned `sha256` (resumable, licence-gated)
#   pack       a pinned archive; selected members are extracted
# The 58 FFmpeg xfade transitions and the extended transitions are added to the catalog from nexus/fx/transitions.py
# (assetlib._transition_entries) so the two can never disagree.
version: 1
policy:
  # licences NEXUS may install (commercial use + modification allowed). Anything else is listed as an optional
  # future resource and never downloaded.
  allowed_licenses: [CC0-1.0, OFL-1.1, Apache-2.0, MIT, CC-BY-4.0, PD-USGov, NEXUS-Proprietary]
  attribution_required: [CC-BY-4.0]
  bundle_license_text: [OFL-1.1, Apache-2.0, MIT]
defaults:
  generated: {license: CC0-1.0, author: "NEXUS (generated locally)", commercial_use: true, attribution: "none required",
              source_url: "https://github.com/Ahmedhan1/new-project-money/blob/main/nexus/assetlib/generators.py"}
  builtin: {license: NEXUS-Proprietary, author: "NEXUS renderer (FFmpeg filters)", commercial_use: true, attribution: "none required",
            source_url: "https://github.com/Ahmedhan1/new-project-money/blob/main/nexus/fx/effects.py"}
assets:
