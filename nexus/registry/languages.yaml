    font: latin
    numerals: western
    length_ratio: {typical: 1.0, max: 1.4, min: 0.45}
    cue_chars: 42
    dub_threshold: 0.6
    translation: madlad
    priority: 1
    status: available
    reason: "source language of the test footage; Piper joe (CC0, rdh CC0 base)"
