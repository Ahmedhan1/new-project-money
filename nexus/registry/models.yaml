# On-demand model downloads. Nothing here is fetched until it is needed (or
# `python -m nexus models fetch` is run). Licences were read from the upstream
# model cards on 2026-11-11.
models:
  whisper-small:
    repo: Systran/faster-whisper-small
    files: [config.json, model.bin, tokenizer.json, vocabulary.txt]
    dir: whisper-small
    size_mb: 490
    license: MIT
    commercial: true
  llm-qwen3-4b:
    repo: Qwen/Qwen3-4B-GGUF
    files: [Qwen3-4B-Q4_K_M.gguf]
    dir: llm
    size_mb: 2500
    license: Apache-2.0
    commercial: true

  mt-madlad400-3b:
    repo: Nextcloud-AI/madlad400-3b-mt-ct2-int8
    files: [config.json, model.bin, shared_vocabulary.json, spiece.model]
    dir: madlad400-3b
    size_mb: 2960
    license: Apache-2.0 (google/madlad400-3b-mt, CTranslate2 int8 conversion by Nextcloud)
    commercial: true

# Piper voices (huggingface.co/rhasspy/piper-voices). `commercial` reflects the TRAINING DATA licence stated
# in each MODEL_CARD (read 2026-11-11 for en/de/ar, 2026-11-12 for the rest) AND the data of the base model
# a voice was fine-tuned from: a voice fine-tuned from `lessac` (Blizzard 2013 data, research only) or from
# `ryan` (CC BY-NC-SA) is a derivative of non-commercial data and is NOT cleared, even if its own data is CC0.
# Clean bases: `rdh` (nl_BE, CC0), `hifi_tts_92` (Hi-Fi TTS reader 92 / LibriVox, CC BY 4.0), trained from scratch.
# `card` quotes the MODEL_CARD lines the decision rests on.
voices:
  en_US-joe-medium:
    lang: en
    path: en/en_US/joe/medium
    gender: male
    license: CC0
    commercial: true
    card: "Dataset License: CC0 (OHF-Voice/voice-datasets); finetuned from rdh base (nl_BE, CC0)"
  en_US-ljspeech-medium:
    lang: en
    path: en/en_US/ljspeech/medium
    gender: female
    license: public domain (LJ Speech)
    commercial: true
    card: "License: public domain; trained from scratch on LJ Speech"
  de_DE-thorsten-medium:
    lang: de
    path: de/de_DE/thorsten/medium
    gender: male
    license: CC0 (Thorsten-Voice)
    commercial: true
    card: "Dataset License: CC0; finetuned from rdh base (CC0)"
  de_DE-kerstin-medium:
    lang: de
    path: de/de_DE/kerstin/medium
    gender: female
    license: CC0
    commercial: true
    card: "Dataset License: CC0 (OHF-Voice/voice-datasets); finetuned from hifi_tts_92 base (CC BY 4.0)"
  fr_FR-siwis-medium:
    lang: fr
    path: fr/fr_FR/siwis/medium
    gender: female
    license: "CC BY 4.0 (SIWIS French Speech Synthesis Database) - credit 'SIWIS database, University of Edinburgh / Idiap' in published work"
    commercial: true
    attribution: "Voice: Piper fr_FR-siwis-medium, trained on the SIWIS French Speech Synthesis Database (CC BY 4.0)"
    card: "Dataset License: CC-BY 4.0 (datashare.is.ed.ac.uk/handle/10283/2353); finetuned from hifi_tts_92 base"
  ru_RU-denis-medium:
    lang: ru
    path: ru/ru_RU/denis/medium
    gender: male
    license: CC0
    commercial: true
    card: "Dataset License: CC0 (OHF-Voice/voice-datasets); finetuned from rdh base (CC0)"
  es_ES-davefx-medium:
    lang: es
    path: es/es_ES/davefx/medium
    gender: male
    license: CC0
    commercial: true
    card: "Dataset License: CC0 (OHF-Voice/voice-datasets); finetuned from rdh base (CC0)"
  pt_BR-cadu-medium:
    lang: pt-BR
    path: pt/pt_BR/cadu/medium
    gender: male
    license: CC0
    commercial: true
    card: "Dataset License: CC0 (OHF-Voice/voice-datasets); finetuned from rdh base (CC0)"
  it_IT-serena-medium:
    lang: it
    path: it/it_IT/serena/medium
    gender: female
    license: "CC BY 4.0 (committa/serena-synthetic-it-27h, synthetic audio from Qwen3-TTS-1.7B-Base, Apache-2.0) - attribution required"
    commercial: true
    attribution: "Voice: Piper it_IT-serena-medium, trained on serena-synthetic-it-27h by Marco Baccarani / Committa (CC BY 4.0)"
    card: "Dataset License: CC-BY-4.0; trained from scratch. Dataset card: audio generated with Qwen3-TTS (Apache-2.0) default 'Serena' speaker; no real-person reference audio; author did not verify Qwen3-TTS training-data consent"
  nl_NL-alex-medium:
    lang: nl
    path: nl/nl_NL/alex/medium
    gender: male
    license: CC0
    commercial: true
    card: "Dataset License: CC0 (OHF-Voice/voice-datasets); finetuned from rdh base (CC0)"
  pl_PL-darkman-medium:
    lang: pl
    path: pl/pl_PL/darkman/medium
    gender: male
    license: CC0
    commercial: true
    card: "Dataset License: CC0 (OHF-Voice/voice-datasets); finetuned from rdh base (CC0)"
  uk_UA-ukrainian_tts-medium:
    lang: uk
    path: uk/uk_UA/ukrainian_tts/medium
    gender: female
    license: CC0
    commercial: true
    card: "Dataset License: CC0 (OHF-Voice/voice-datasets); trained from scratch; 3 speakers (lada, mykyta, tetiana), speaker 0 used"
  ar_JO-kareem-medium:
    lang: ar
    path: ar/ar_JO/kareem/medium
    gender: male
    license: "UNVERIFIED - model card says 'See URL'; dataset repo AliMokhammad/arabicttstrain has no licence file"
    commercial: false   # treated as not cleared until a licence is confirmed
    card: "Dataset License: See URL (github.com/AliMokhammad/arabicttstrain); finetuned from lessac (research-only data) - two independent reasons it is not cleared"
    note: "Only Arabic voice in rhasspy/piper-voices (re-checked 2026-11-12: kareem low/medium only). Jordanian/MSA-leaning, not Egyptian or Gulf. Drafts only; clear-licence fallback is espeak-ng (robotic). Candidate replacement: Chatterbox Multilingual (MIT) - needs benchmarking."

# Commercially cleared but NOT runnable in the current install (kept here so nobody re-does the licence work).
blocked_voices:
  zh_CN-chaowen-medium:
    lang: zh
    path: zh/zh_CN/chaowen/medium
    license: CC0
    commercial: true
    card: "Dataset License: CC0 (OHF-Voice/voice-datasets); finetuned from hifi_tts_92 base; phoneme_type pinyin via g2pW"
    blocked_by: "piper's Chinese phonemizer imports unicode_rbnf and transformers (BertTokenizer 'bert-base-chinese', Apache-2.0) and needs the g2pW onnx model (huggingface.co/datasets/rhasspy/piper-checkpoints zh/zh_CN/_resources/g2pw.tar.gz). None installed; PyPI was not an allowed host for LANG-1."

