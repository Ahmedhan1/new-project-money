# Language registry (LANG-1). One entry per target language; everything language-specific in
# localize / mt / asr / subs / text / config fonts is read from here. Facts were checked on 2026-11-12:
#  - `madlad`: the MADLAD-400 target tag. Every tag listed was verified to be a single piece in the
#    model's shared_vocabulary.json AND spiece.model (.nexus/models/madlad400-3b). Absent from the
#    vocabulary: afb (Gulf), ars (Najdi), acm (Mesopotamian), apc / ajp (Levantine), aeb (Tunisian), yue.
#    Present Arabic varieties: ar (MSA), arz (Egyptian), ary (Moroccan).
#  - `voice`: the Piper voice used for the dub (details + licence evidence in models.yaml `voices`), or
#    null -> eSpeak NG (`espeak` voice code), GPL engine, output unencumbered, robotic quality.
#  - `status`: available      = translation + subtitles + a commercially usable dub that passed the measured gates
#              subtitles-only = translation + subtitles are usable; the dub is a draft (licence not verified or too weak)
#              unavailable    = this pipeline cannot produce the language correctly (see `reason`)
#    Machine translation ALWAYS still needs a native-speaker review before publishing.
#  - `length_ratio`: target characters per English source character (typical / max / min). Measured on the
#    solar test lines (docs/results/languages.json); max is the invented-content guard, min the dropped-content guard.
#  - `dub_threshold`: minimum share of script words (characters for Han) Whisper-small must hear back from the dub.
#  - `cue_chars`: max characters per subtitle cue (Han is counted per character, no spaces).

fonts:
  latin:
    family: DejaVu Sans
    sample: "AÄéß"
    files:
      - {file: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf, family: DejaVu Sans}
      - {file: /usr/share/fonts/truetype/noto/NotoSans-Bold.ttf, family: Noto Sans}
      - {file: "%WINDIR%/Fonts/segoeuib.ttf", family: Segoe UI}
      - {file: "%WINDIR%/Fonts/arialbd.ttf", family: Arial}
      - {file: "/System/Library/Fonts/Supplemental/Arial Bold.ttf", family: Arial}
  cyrillic:
    family: DejaVu Sans
    sample: "Жщы"
    files:
      - {file: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf, family: DejaVu Sans}
      - {file: /usr/share/fonts/truetype/noto/NotoSans-Bold.ttf, family: Noto Sans}
      - {file: "%WINDIR%/Fonts/segoeuib.ttf", family: Segoe UI}
      - {file: "%WINDIR%/Fonts/arialbd.ttf", family: Arial}
      - {file: "/System/Library/Fonts/Supplemental/Arial Bold.ttf", family: Arial}
  arabic:
    family: Noto Naskh Arabic
    sample: "ضظغ"
    files:
      - {file: /usr/share/fonts/truetype/noto/NotoNaskhArabic-Bold.ttf, family: Noto Naskh Arabic}
      - {file: /usr/share/fonts/truetype/noto/NotoSansArabic-Bold.ttf, family: Noto Sans Arabic}
      - {file: "%WINDIR%/Fonts/tahomabd.ttf", family: Tahoma}
      - {file: "%WINDIR%/Fonts/segoeuib.ttf", family: Segoe UI}
      - {file: "%WINDIR%/Fonts/arialbd.ttf", family: Arial}
      - {file: /System/Library/Fonts/GeezaPro.ttc, family: Geeza Pro}
      - {file: /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf, family: DejaVu Sans}
  devanagari:
    family: Noto Sans Devanagari
    sample: "हिक्ष"
    files:   # Linux: apt fonts-noto-core
      - {file: /usr/share/fonts/truetype/noto/NotoSansDevanagari-Bold.ttf, family: Noto Sans Devanagari}
      - {file: /usr/share/fonts/truetype/noto/NotoSansDevanagari-Regular.ttf, family: Noto Sans Devanagari}
      - {file: /usr/share/fonts/truetype/lohit-devanagari/Lohit-Devanagari.ttf, family: Lohit Devanagari}
      - {file: /usr/share/fonts/truetype/freefont/FreeSansBold.ttf, family: FreeSans}
      - {file: "%WINDIR%/Fonts/NirmalaB.ttf", family: Nirmala UI}
      - {file: "%WINDIR%/Fonts/mangalb.ttf", family: Mangal}
      - {file: /System/Library/Fonts/Kohinoor.ttc, family: Kohinoor Devanagari}
      - {file: /System/Library/Fonts/Supplemental/DevanagariMT.ttc, family: Devanagari MT}
  han_sc:
    family: Noto Sans CJK SC
    sample: "汉语电池"
    files:   # Linux: apt fonts-noto-cjk (index 2 = SC in the Noto CJK collection)
      - {file: /usr/share/fonts/opentype/noto/NotoSansCJK-Bold.ttc, index: 2, family: Noto Sans CJK SC}
      - {file: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc, index: 2, family: Noto Sans CJK SC}
      - {file: /usr/share/fonts/truetype/wqy/wqy-zenhei.ttc, index: 0, family: WenQuanYi Zen Hei}
      - {file: "%WINDIR%/Fonts/msyhbd.ttc", index: 0, family: Microsoft YaHei}
      - {file: "%WINDIR%/Fonts/simhei.ttf", family: SimHei}
      - {file: /System/Library/Fonts/PingFang.ttc, index: 0, family: PingFang SC}
      - {file: "/System/Library/Fonts/STHeiti Medium.ttc", index: 0, family: Heiti SC}

# Sentence terminators per script (subtitle cue breaks, MT sentence-count trim). Clause marks: preferred long-cue breaks.
scripts:
  latin: {chars: "latin", terminators: ".!?…", clause: ",;:", spaces: true}
  cyrillic: {chars: "cyrillic", terminators: ".!?…", clause: ",;:", spaces: true}
  arabic: {chars: "arabic", terminators: ".!?؟۔…", clause: "،؛,;:", spaces: true}
  devanagari: {chars: "devanagari", terminators: "।॥.!?", clause: ",;:", spaces: true}
  han: {chars: "han", terminators: "。！？!?…", clause: "，、；：,;:", spaces: false}

dialect_markers:
  # Whole words or word endings typical of the dialect and NOT of MSA. Density = share of words that match.
  ar-EG: {min_density: 0.06,
          words: [ده, دي, مش, عشان, علشان, دلوقتي, إزاي, ازاي, ليه, كده, اللي, أوي, قوي, بتاع, إحنا, احنا, كمان, بقى, لسه, عايز, فيه, زي, يعني],
          prefixes: "^(بي|بت|بن|بيت|هي|هت|هن)\\w{2,}"}
  ar-GULF: {min_density: 0.06,
            words: [الحين, وايد, واجد, شلون, ليش, شنو, وش, ايش, مو, مب, أبي, ابي, يبي, نبي, تبي, يبون, نبغى, ابغى, أبغى, جذي, چذي, كذا, زين, حق, ترى, اللي, هذيل, هذولا, عشان, قاعد, قاعدين],
            prefixes: "^(هال|بي|بن|بت)\\w{2,}",
            # Egyptian-only forms: if these dominate, the output is Masri, not Gulf
            exclude: [ده, دي, دلوقتي, إزاي, ازاي, كده, أوي, بتاع, مش, عايز, لسه]}

aliases:   # other spellings that resolve to a registry code
