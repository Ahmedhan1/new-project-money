# Creative-direction profiles for nexus/director.py (WS B, DIR-1; 14 creative profiles DIR-3).
# Each profile is a set of MEASURABLE editorial parameters - an abstraction of how a kind of programme is paced and
# structured. They are written from general editing practice. No profile contains or copies anyone's footage, scripts,
# titles, music or graphics, and none claims equivalence to a studio, broadcaster, channel or named creator; a name such
# as "high-energy challenge" describes a structure (stakes up front, escalation, frequent interrupts, payoff), nothing more.
#
# Fields (seconds unless stated):
#   shot_len: [min, max]        target length of a visible shot; longer stretches get a cutaway or a punch-in reframe
#   shot_len_median             target median visible shot (the split point aimed for inside long pieces)
#   pacing: steady|build|front_loaded|wave   how the shot-length target varies over the programme
#   pause_tolerance             longest pause kept inside speech; longer ones become jump cuts
#   filler_removal 0..1         0 keeps every filler; >=0.3 removes um/uh; >=0.6 also "you know"/"I mean"; >=0.9 also loose fillers
#   drop_tangents               drop topics classified as tangents
#   opening: cold_open|hook_first|title_first   cold_open = strongest self-contained line, then the title card
#   hook_window_s               the hook line must START inside this window; a title card that would push it out moves after it
#   ending: resolution|callback|end_card|fade_out
#   end_structure: {recap, cta}  recap = keep the concluding line; cta = end card with the brief's end_text
#   transitions.vocabulary      cut types the director may use: hard_cut, jump_cut, j_cut, l_cut, crossfade
#   transitions.crossfade_at_topics  crossfades only ever happen at topic boundaries
#   transitions.xfade / dur     FFmpeg xfade name (fx.transitions.NAMES) and duration for those crossfades
#   transitions.punch_in        scale used to hide a jump cut (1.0 = do not hide)
#   pattern_interrupt_s         longest stretch without a visual change (cut, cutaway or reframe)
#   cutaways_per_min            budget of cutaways per programme minute (0 = none)
#   grade                       a name in fx.post.GRADES (colour look)
#   music: {enabled, mood, volume, energy: [start, middle, end] 0..1}   mood = nexus.audio.music mood
#   captions                    tl["captions"] (docs/TIMELINE.md)
#   titles: {card_seconds, lower_thirds, chapters, chapter_text}
#   chapters: {min_s}           chapters shorter than this merge into the previous one
#   title_style: statement|question|how_to|number|teaser   how titles (master + shorts) are phrased
#   broll: {policy: none|cutaway, max_talk, min, max}
#   look                        clip effects applied to every footage clip
#   allowed_effects             effect types the director may add
#   shorts: {min_s, max_s, captions}   defaults for shorts made under this profile
