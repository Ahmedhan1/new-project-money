    quotas: "unpublished; Wikimedia robot policy: descriptive User-Agent with contact, serial requests, honour 429 and Retry-After; results cached in NEXUS_HOME/cache"
    commercial_use: "yes (CC0 data)"
    usage_restrictions: "no bulk crawling; use the dumps for bulk; a generic User-Agent gets HTTP 429"
    data_retention: "place names queried are sent to Wikimedia"
    availability: "remote; visual-context check treats an unresolved place as unknown"
    hardware: none
    network_hosts: [www.wikidata.org]
    status: adapter
