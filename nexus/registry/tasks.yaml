# NEXUS development task registry - the single source of truth for "what next".
# Statuses: planned | in_progress | implemented | tested | verified | blocked | deferred | rejected
#   implemented = code exists          tested = automated test passes
#   verified    = works in the integrated product, with evidence   (never mark verified without `evidence`)
# Priority: 1 = do first. `python -m nexus tasks` prints the next ready tasks; docs/GAP_ANALYSIS.md maps
# the 40 product domains to these ids.
tasks:
  # ------------------------------------------------------------------ recovery / memory / storage
  - id: MEM-1
    priority: 1
    title: "Project memory files + checkpoint engine (state, handoff, task registry, secret/large-file guard)"
    status: verified
    acceptance: "A fresh session can resume from NEXUS_HANDOFF.md + NEXUS_STATE.json alone; checkpoint refuses secrets/media; never force-pushes."
    test: "pytest tests/fast/test_state.py"
    evidence: "tests/fast/test_state.py passes; this repository's own checkpoints are made with `nexus checkpoint`"
    next: "Keep NEXUS_HANDOFF.md under 1,500 words as the project grows."
  - id: JOB-1
    priority: 1
    title: "Durable job ledger with stage checkpoints, heartbeats, retry and crash recovery"
    status: verified
    acceptance: "Killing the worker mid-job loses nothing; after restart the job finishes and completed stages are not re-run."
    test: "pytest tests/fast/test_jobs.py (kills a real worker process with SIGKILL mid-stage)"
    evidence: "tests/fast/test_jobs.py::test_worker_killed_mid_job_resumes_without_repeating_stages"
    next: "Add job cancellation for running jobs (today only queued jobs can be cancelled)."
  - id: JOB-2
    priority: 2
    title: "Move remaining in-process API jobs onto the durable ledger (analyze, remix, series, film, animate, package)"
    status: tested
    deps: [JOB-1]
    acceptance: "No API endpoint submits a closure; every job kind has a named handler with stages and survives a restart."
    test: "pytest tests/fast/test_jobs.py; real run: POST /api/animate executed by the separate worker process"
    evidence: "api.py has no in-memory queue; series-episode crash test passes; kinetic animation job ran end to end via API + worker process"
    next: "Verify analyze, remix and package handlers with real models (they are covered by heavy tests A, B, G only through the library, not through the job handlers)."
