# Platform knowledge base (WS F, PLAT-1). Read by nexus/platforms.py; documented in docs/PLATFORMS.md.
#
# Every field is {value, kind, source, read_on, note?}:
#   documented    stated by the platform itself on the `source` page, read on `read_on` (https source required)
#   observed      not confirmed on an official page this session; widely reported by third parties (one is cited)
#   experimental  an editorial choice or rule of thumb made by NEXUS (source "editorial: ..."), never platform data
#   unverified    value is null: nothing reliable was found; the note says what is missing
# Specs change. `reviewed_on` (global and per profile) drives platforms.stale(days=90). To update a field: re-read the
# source page, change value/kind/read_on, bump the profile's reviewed_on, run `pytest tests/fast/test_platforms.py`.
# Ranking systems are not public. Nothing here encodes an algorithm rule; reach-related notes quote the platform.

schema_version: 1
reviewed_on: "2026-11-12"

sources:
