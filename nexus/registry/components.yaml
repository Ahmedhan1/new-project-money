    capability: [3d-animation, product-visualisation]
    source_url: https://projects.blender.org/blender/blender
    license: GPL-3.0-or-later
    commercial_use: "yes (renders are yours)"
    usage_restrictions: "no GPU here: Cycles CPU only, keep samples/resolution low"
    hardware: "CPU; 8 GB+ RAM"
    install: "apt-get install blender  (or official tarball from download.blender.org)"
    version_cmd: ["blender", "--version"]
