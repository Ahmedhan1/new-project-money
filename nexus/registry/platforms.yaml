# Value conventions
#   aspect_accepted   {min, max} as width/height ratios, or {any: true}
#   resolution_*      {width, height} | {short_side} | {long_side} | {width} (max columns)
#   fps               {min, max} or {list: [...]}
#   sizes in bytes, durations in seconds, loudness in LUFS integrated
#   safe_zone         fractions of the frame covered by platform UI: {top, bottom, left, right}

platforms:

  # ------------------------------------------------------------------ YouTube (long-form)
  youtube:
    display: "YouTube (long-form video)"
    family: youtube
    reviewed_on: "2026-11-12"
    fields:
      aspect_accepted: {value: {any: true}, kind: documented, source: *yt_encoding, read_on: "2026-11-12", note: "16:9 is standard on computers; vertical and square are supported and the player adapts"}
      aspect_recommended: {value: "16:9", kind: documented, source: *yt_resolution, read_on: "2026-11-12", note: "do not add padding or black bars to the video; the player pads non-16:9 itself"}
      resolution_min: {value: null, kind: unverified, note: "no minimum stated; the recommended table goes down to 426x240"}
      resolution_recommended: {value: {width: 1920, height: 1080}, kind: documented, source: *yt_resolution, read_on: "2026-11-12", note: "1080p is one of the listed 16:9 resolutions (240p to 4320p); NEXUS renders 1080p"}
      resolution_max: {value: {width: 7680, height: 4320}, kind: documented, source: *yt_resolution, read_on: "2026-11-12"}
      fps: {value: {list: [24, 25, 30, 48, 50, 60]}, kind: documented, source: *yt_encoding, read_on: "2026-11-12", note: "upload at the frame rate it was recorded; deinterlace interlaced material"}
      duration_min_s: {value: null, kind: unverified, note: "no minimum stated on the pages read"}
      duration_max_s: {value: 43200, kind: documented, source: *yt_upload_long, read_on: "2026-11-12", note: "256 GB or 12 hours, whichever is less"}
      duration_default_max_s: {value: 900, kind: documented, source: *yt_upload_long, read_on: "2026-11-12", note: "by default uploads are limited to 15 minutes; verified accounts can upload longer (account-dependent)"}
      max_file_bytes: {value: 256000000000, kind: documented, source: *yt_upload_long, read_on: "2026-11-12"}
      container: {value: [mp4], kind: documented, source: *yt_encoding, read_on: "2026-11-12", note: "MP4, no edit lists, moov atom at the front (fast start). The page frames these as recommended settings"}
      video_codec: {value: [h264], kind: documented, source: *yt_encoding, read_on: "2026-11-12", note: "H.264 High profile, progressive, CABAC, VBR (recommended, not the only accepted codec)"}
      audio_codec: {value: [aac, opus], kind: documented, source: *yt_encoding, read_on: "2026-11-12", note: "AAC-LC, Opus or Eclipsa Audio"}
      audio_sample_rate: {value: 48000, kind: documented, source: *yt_encoding, read_on: "2026-11-12"}
      audio_bitrate_kbps: {value: 384, kind: documented, source: *yt_encoding, read_on: "2026-11-12", note: "stereo; mono 128, 5.1 512"}
      video_bitrate_mbps: {value: {"1080p_30": 8, "1080p_60": 12, "2160p_30": 35, "2160p_60": 53}, kind: documented, source: *yt_encoding, read_on: "2026-11-12", note: "SDR recommendations; 4K values are the lower ends of 35-45 / 53-68"}
      loudness_documented: {value: null, kind: unverified, note: "YouTube does not publish an upload loudness target on any page read"}
      loudness_target_lufs: {value: -14.0, kind: experimental, source: "editorial: NEXUS default (render.py target_lufs)", read_on: "2026-11-12", note: "editorial default, not a platform requirement"}
      caption_files: {value: [srt, vtt, sbv, ttml, dfxp, sami, rt, mpsub, lrc, cap], kind: documented, source: *yt_subtitles, read_on: "2026-11-12", note: "SRT and SBV must be plain UTF-8; WebVTT supports positioning"}
      title_max_chars: {value: 100, kind: documented, source: *yt_api_videos, read_on: "2026-11-12", note: "may not contain < or >"}
      description_max_bytes: {value: 5000, kind: documented, source: *yt_api_videos, read_on: "2026-11-12", note: "5000 BYTES of UTF-8, not characters; may not contain < or >"}
      tags_max_chars: {value: 500, kind: documented, source: *yt_api_videos, read_on: "2026-11-12", note: "whole tag list; commas count; tags with spaces count their quotes"}
      hashtags_max: {value: 60, kind: documented, source: *yt_hashtags, read_on: "2026-11-12", note: "with more than 60 hashtags ALL are ignored; up to 3 are shown near the title"}
      thumbnail: {value: {width: 3840, height: 2160, min_width: 640, aspect: "16:9", formats: [jpg, png], max_bytes: 2000000, max_bytes_desktop: 50000000, needs_verified_account: true}, kind: documented, source: *yt_thumbnails, read_on: "2026-11-12", note: "2 MB limit applies on mobile, 50 MB on desktop; NEXUS writes a 1920x1080 JPEG under 2 MB"}
      safe_zone: {value: null, kind: unverified, note: "no official overlay zones for long-form; player controls auto-hide"}
      hook_window_s: {value: 5.0, kind: experimental, source: "editorial: growth.PLATFORM_NORMS youtube first_speech_max", read_on: "2026-11-12", note: "rule of thumb, not platform data"}
      music_policy: {value: "Use music you own or have licensed. Tracks from the YouTube Audio Library do not receive Content ID claims.", kind: documented, source: *yt_shorts_3min, read_on: "2026-11-12"}
      upload_api: {value: {api: "YouTube Data API v3 videos.insert", auth: "OAuth 2.0 consent of the channel owner via the owner's own Google Cloud project", quota: "default 100 videos.insert calls/day; 10,000 units/day for other endpoints; more via the quota extension form", paid_tier: "no price stated on the pages read", review: "quota extension request form for more quota"}, kind: documented, source: *yt_api_quota, read_on: "2026-11-12", note: "videos.insert page (also read) states 256 GB max and that unverified-project uploads are not restricted to private"}
      analytics_api: {value: {api: "YouTube Analytics API / Reporting API", auth: "OAuth authorisation by the channel owner"}, kind: documented, source: *yt_analytics, read_on: "2026-11-12", note: "metric names (e.g. averageViewDuration) are on linked metric pages not read this session; use the manual CSV import"}
      manual_upload: {value: ["Open https://studio.youtube.com and sign in to the channel.", "Click Create > Upload videos and choose video.mp4 from this folder.", "Paste the title (title.txt) and description (description.txt).", "Thumbnail: upload thumbnail.jpg (custom thumbnails need a verified account).", "Audience: answer the 'made for kids' question truthfully.", "Video elements: add subtitles: Upload file > With timing > captions.srt.", "Checks: wait for the copyright check to finish before publishing.", "Visibility: choose Private or Unlisted first, review the processed video, then publish."], kind: experimental, source: "editorial: NEXUS checklist built from the documented limits above", read_on: "2026-11-12", note: "Studio menu names can change; the limits it relies on are documented above"}

  # ------------------------------------------------------------------ YouTube Shorts
  youtube_shorts:
    display: "YouTube Shorts"
    family: youtube
    reviewed_on: "2026-11-12"
    fields:
      aspect_accepted: {value: {min: 0.0, max: 1.0}, kind: documented, source: *yt_shorts_3min, read_on: "2026-11-12", note: "square or vertical uploads up to 3 minutes are classified as Shorts; 16:9 stays long-form"}
      aspect_recommended: {value: "9:16", kind: observed, source: *yt_safe_obs, read_on: "2026-11-12", note: "the help pages say 'vertical'; 9:16 is the universal reading and matches the documented 9:16 Shorts thumbnail"}
      resolution_min: {value: null, kind: unverified, note: "no minimum stated"}
      resolution_recommended: {value: {width: 1080, height: 1920}, kind: observed, source: *yt_safe_obs, read_on: "2026-11-12"}
      resolution_max: {value: {width: 1080, height: 1920}, kind: documented, source: *yt_shorts, read_on: "2026-11-12", note: "uploaded Shorts can have a maximum resolution of 1080p"}
      fps: {value: {list: [24, 25, 30, 48, 50, 60]}, kind: documented, source: *yt_encoding, read_on: "2026-11-12", note: "general YouTube encoding guidance"}
      duration_min_s: {value: null, kind: unverified, note: "no minimum stated"}
      duration_max_s: {value: 180, kind: documented, source: *yt_shorts_3min, read_on: "2026-11-12", note: "up to three minutes; longer square/vertical uploads are long-form videos"}
      max_file_bytes: {value: 256000000000, kind: documented, source: *yt_upload_long, read_on: "2026-11-12"}
      container: {value: [mp4], kind: documented, source: *yt_encoding, read_on: "2026-11-12"}
      video_codec: {value: [h264], kind: documented, source: *yt_encoding, read_on: "2026-11-12"}
      audio_codec: {value: [aac, opus], kind: documented, source: *yt_encoding, read_on: "2026-11-12"}
      audio_sample_rate: {value: 48000, kind: documented, source: *yt_encoding, read_on: "2026-11-12"}
      audio_bitrate_kbps: {value: 384, kind: documented, source: *yt_encoding, read_on: "2026-11-12"}
      loudness_documented: {value: null, kind: unverified, note: "no loudness target published"}
      loudness_target_lufs: {value: -14.0, kind: experimental, source: "editorial: NEXUS default", read_on: "2026-11-12", note: "editorial default, not a platform requirement"}
      caption_files: {value: [srt, vtt, sbv, ttml], kind: documented, source: *yt_subtitles, read_on: "2026-11-12", note: "the subtitle page is generic to YouTube videos; NEXUS also burns captions in for sound-off viewing"}
      title_max_chars: {value: 100, kind: documented, source: *yt_api_videos, read_on: "2026-11-12"}
      description_max_bytes: {value: 5000, kind: documented, source: *yt_api_videos, read_on: "2026-11-12"}
      hashtags_max: {value: 60, kind: documented, source: *yt_hashtags, read_on: "2026-11-12"}
      thumbnail: {value: {width: 2160, height: 3840, min_height: 640, aspect: "9:16", formats: [jpg, png], max_bytes: 2000000, needs_verified_account: true, desktop_only: true}, kind: documented, source: *yt_thumbnails, read_on: "2026-11-12", note: "custom Shorts thumbnails: verified account, YouTube Studio on a computer"}
      safe_zone: {value: {top: 0.15, bottom: 0.35, left: 0.044, right: 0.178}, kind: observed, source: *yt_safe_obs, read_on: "2026-11-12", note: "figures attributed to Google Ads guidance for vertical video ads; no official organic Shorts safe zone was found"}
      hook_window_s: {value: 1.5, kind: experimental, source: "editorial: growth.PLATFORM_NORMS shorts first_speech_max", read_on: "2026-11-12", note: "rule of thumb, not platform data"}
      music_policy: {value: "A Short longer than 1 minute with ANY active copyright claim is blocked globally (not playable, recommended or monetised) until the claim is resolved. Most Shorts Audio Library songs can be used for up to 90 s (some 60 or 30 s).", kind: documented, source: *yt_shorts_3min, read_on: "2026-11-12"}
      upload_api: {value: {api: "YouTube Data API v3 videos.insert (same as long-form)", auth: "OAuth 2.0 consent of the channel owner", quota: "default 100 videos.insert calls/day", paid_tier: "no price stated on the pages read", review: "quota extension form"}, kind: documented, source: *yt_api_quota, read_on: "2026-11-12"}
      analytics_api: {value: {api: "YouTube Analytics API", auth: "OAuth authorisation by the channel owner"}, kind: documented, source: *yt_analytics, read_on: "2026-11-12"}
      manual_upload: {value: ["Open https://studio.youtube.com (or the YouTube app) on the channel.", "Create > Upload videos > video.mp4 (vertical, at most 3 minutes, so it is classified as a Short).", "Paste the title and description; hashtags go in the description.", "Optional: custom thumbnail thumbnail.jpg from Studio on a computer (verified account only).", "Upload captions.srt under Subtitles if you want a selectable caption track.", "If the Short is over 1 minute, make sure no third-party music or clip can trigger a copyright claim (it would be blocked globally).", "Publish as Private/Unlisted first, check it on a phone, then make it Public."], kind: experimental, source: "editorial: NEXUS checklist built from the documented limits above", read_on: "2026-11-12"}

  # ------------------------------------------------------------------ TikTok
  tiktok:
    display: "TikTok"
    family: tiktok
    reviewed_on: "2026-11-12"
    fields:
      aspect_accepted: {value: null, kind: unverified, note: "the developer upload spec limits pixel sizes (360-4096 px per side) but states no aspect-ratio range"}
      aspect_recommended: {value: "9:16", kind: documented, source: *tt_ads_specs, read_on: "2026-11-12", note: "stated on TikTok's In-Feed ads spec page (9:16 recommended); used for organic posts as the best official guidance"}
      resolution_min: {value: {short_side: 360}, kind: documented, source: *tt_media, read_on: "2026-11-12", note: "Content Posting API: minimum 360 px for both height and width"}
      resolution_recommended: {value: {width: 1080, height: 1920}, kind: observed, source: *short_safe_obs, read_on: "2026-11-12", note: "ads page states 540x960 or larger for 9:16; 1080x1920 is the common creator target"}
      resolution_max: {value: {long_side: 4096}, kind: documented, source: *tt_media, read_on: "2026-11-12"}
      fps: {value: {min: 23, max: 60}, kind: documented, source: *tt_media, read_on: "2026-11-12"}
      duration_min_s: {value: null, kind: unverified, note: "no minimum stated"}
      duration_max_s: {value: 600, kind: documented, source: *tt_media, read_on: "2026-11-12", note: "longest video a developer can send via the upload endpoint is 10 minutes. In-app limits are account-dependent (60-minute uploads tested for some users, observed: see tt_length_obs); a creator's own limit is returned as max_video_post_duration_sec by the creator-info query"}
      max_file_bytes: {value: 4000000000, kind: documented, source: *tt_media, read_on: "2026-11-12"}
      container: {value: [mp4, webm, mov], kind: documented, source: *tt_media, read_on: "2026-11-12", note: "MP4 recommended"}
      video_codec: {value: [h264, hevc, vp8, vp9], kind: documented, source: *tt_media, read_on: "2026-11-12", note: "H.264 recommended"}
      audio_codec: {value: null, kind: unverified, note: "no audio codec stated on the developer page; NEXUS uses AAC 48 kHz"}
      audio_sample_rate: {value: null, kind: unverified, note: "not stated"}
      loudness_documented: {value: null, kind: unverified, note: "no loudness target published"}
      loudness_target_lufs: {value: -14.0, kind: experimental, source: "editorial: NEXUS default", read_on: "2026-11-12", note: "editorial default, not a platform requirement"}
      caption_files: {value: null, kind: unverified, note: "no caption-file upload documented on the pages read; NEXUS burns captions into the picture"}
      title_max_chars: {value: null, kind: unverified, note: "TikTok has no separate title: the post caption (post_info.title) is the text field"}
      caption_max_utf16: {value: 2200, kind: documented, source: *tt_direct, read_on: "2026-11-12", note: "max 2200 UTF-16 runes; hashtags and mentions are matched in the caption"}
      hashtags_max: {value: null, kind: unverified, note: "no hashtag count limit stated"}
      thumbnail: {value: null, kind: unverified, note: "cover is chosen from a frame in the app; no cover-image spec read this session. NEXUS writes cover.jpg as a frame suggestion"}
      safe_zone: {value: {top: 0.15, bottom: 0.30, left: 0.10, right: 0.15}, kind: observed, source: *short_safe_obs, read_on: "2026-11-12", note: "TikTok's ads page says the safe zone depends on dimensions and caption length and offers template files only (no numbers)"}
      hook_window_s: {value: 1.0, kind: experimental, source: "editorial: growth.PLATFORM_NORMS tiktok first_speech_max", read_on: "2026-11-12", note: "rule of thumb, not platform data"}
      music_policy: {value: "Businesses cannot use the general music library for commercial use; business accounts must use the Commercial Music Library for organic posts, ads and branded content.", kind: documented, source: *tt_cml, read_on: "2026-11-12"}
      upload_api: {value: {api: "Content Posting API (Direct Post)", auth: "registered developer app with the Content Posting API product; app approved for the video.publish scope; the user authorises via Login Kit", review: "until the API client passes TikTok's audit ALL posts are restricted to private viewing", paid_tier: "no price stated on the pages read"}, kind: documented, source: *tt_start, read_on: "2026-11-12"}
      analytics_api: {value: {api: "Display API video object", fields: [view_count, like_count, comment_count, share_count], retention: "no watch-time or retention fields documented"}, kind: documented, source: *tt_video_obj, read_on: "2026-11-12", note: "retention data only via the manual TikTok Studio export"}
      manual_upload: {value: ["Open the TikTok app or https://www.tiktok.com/upload (TikTok Studio) on the account.", "Upload video.mp4 (vertical 9:16; captions are burned in).", "Paste caption.txt (title + description + hashtags, at most 2200 characters).", "Choose a cover frame; cover.jpg in this folder shows the suggested moment.", "Business accounts: only Commercial Music Library sounds may be added.", "Check the preview with the on-screen buttons: nothing important should sit under them.", "Post (or save as private first and review on a phone)."], kind: experimental, source: "editorial: NEXUS checklist built from the documented limits above", read_on: "2026-11-12"}

