    desc_max: 4000
    hashtags: 4
    hashtag_max: 10
    safe_zone: {top: 0.12, bottom: 0.24, left: 0.05, right: 0.15}
    loudness_lufs: -14
    captions: {style: pop, position: middle, words_per_cue: 3, uppercase: true, highlight: "#FFD400"}
    captions_required: true
    title_card: remove
    title_card_max_s: 0
    progress_bar: true
    hook_s: 1.0
    end: loop
    spec_confidence: editorial-rule-of-thumb
    spec_sources: ["unverified (from model knowledge, 2025): 10-minute in-app uploads, 4000-character captions, 9:16 1080x1920"]
    signals:
      - id: tt-factors
        claim: "For You recommendations rank videos on a combination of factors: user interactions (likes, shares, follows, comments, content created), video information (captions, sounds, hashtags) and device/account settings."
        source: {title: "How TikTok recommends videos #ForYou (TikTok Newsroom)", url: "https://newsroom.tiktok.com/en-us/how-tiktok-recommends-videos-for-you/"}
        read_on: "2026-11-12"
        verified_via: search-result excerpt of the official page
        confidence: official-statement
        implication: "Metadata carries an accurate first-line title and a few topical hashtags; captions are burned in and also exported as text."
      - id: tt-completion
        claim: "A strong indicator of interest, such as whether a user finishes watching a longer video from beginning to end, weighs more than weak indicators."
        source: {title: "How TikTok recommends videos #ForYou (TikTok Newsroom)", url: "https://newsroom.tiktok.com/en-us/how-tiktok-recommends-videos-for-you/"}
        read_on: "2026-11-12"
        verified_via: "model knowledge of the same 2020 post; this sentence was not in the search excerpt"
        confidence: official-statement
        implication: "Short cuts are trimmed to their strongest complete moment (15-60 s), pauses removed, loopable ending."
      - id: tt-duplicates
        claim: "Duplicated content, content already seen and spam are not recommended; newly uploaded videos under review may be ineligible for For You."
        source: {title: "How TikTok recommends videos #ForYou (TikTok Newsroom)", url: "https://newsroom.tiktok.com/en-us/how-tiktok-recommends-videos-for-you/"}
        read_on: "2026-11-12"
        verified_via: search-result excerpt of the official page
        confidence: official-statement
        implication: "Every platform cut is a distinct edit from footage the user owns; NEXUS adds no tricks to disguise reposts."
      - id: tt-diversity
        claim: "The For You feed generally avoids showing two videos in a row from the same creator or with the same sound."
        source: {title: "How TikTok recommends videos #ForYou (TikTok Newsroom)", url: "https://newsroom.tiktok.com/en-us/how-tiktok-recommends-videos-for-you/"}
        read_on: "2026-11-12"
        verified_via: search-result excerpt of the official page
        confidence: official-statement
        implication: "Several different moments per long video rather than one clip reposted; procedural music beds differ per seed."
      - id: tt-hook
        claim: "The first second decides whether a viewer stays."
        source: "unverified (editorial practice, 2024)"
        read_on: "2026-11-12"
        confidence: editorial-rule-of-thumb
        implication: "Hook rule: first visual and caption at 0 s, no title card, first speech within 1 s."

