# NEXUS generation matrix (WS H, task GEN-0). Machine-readable; validated by nexus/generate/registry.py and
# tests/fast/test_generate.py. Decision document: docs/GENERATION.md.
#
# Rules for every entry
#   * `weights_licence` is the licence of the WEIGHTS (not the code). `commercial_use` is one of
#       yes         - commercial use of outputs allowed without registration, revenue cap or territory limit
#                     (use-based restrictions such as OpenRAIL "Attachment A" may still apply; see `conditions`)
#       restricted  - allowed only under conditions (revenue cap, registration, territory, attribution in UI ...)
#       no          - research / non-commercial only
#       unverified  - we could not read the licence text (gated, missing, or ambiguous) - treated like `no`
#   * `source_url` is the page we actually read; `read_on` is when. Hugging Face metadata was read through
#     https://huggingface.co/api/models/<repo> and the licence files through .../raw/main/<file>.
#   * `cpu.feasible`: yes (measured or documented usable) | slow (works, minutes per output) | no | unmeasured
#   * Numbers we did not measure or read are written as `unverified` / `unmeasured`, never guessed.
#   * `download_gb` = what NEXUS would fetch (subset), `repo_gb` = whole HF repo (all precisions/variants).
#   * NEXUS policy: only `commercial_use: yes` models are used by default. `restricted` needs the caller to accept
#     the conditions; `no`/`unverified` need an explicit non-commercial opt-in (generate.image(..., allow_noncommercial=True)).
