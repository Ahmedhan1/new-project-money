# Clearly licensed neural TTS candidates for a later CPU/GPU benchmark (PyTorch, NOT deployed - no install in LANG-1).
# Licence evidence = `cardData.license` from huggingface.co/api/models/<repo>, read 2026-11-12; re-read before deploying.
tts_candidates:
  - {name: "Chatterbox Multilingual (ResembleAI/chatterbox)", license: MIT, languages: "ar da de el en es fi fr he hi it ja ko ms nl no pl pt ru sv sw tr zh (HF card)",
     note: "MIT code + weights per model card; covers the Arabic, Hindi, Turkish and Chinese gaps; voice cloning - consent rules apply"}
  - {name: "Kokoro-82M (hexgrad/Kokoro-82M)", license: Apache-2.0, languages: "en, fr, es, it, pt-BR, hi, zh, ja",
     note: "HF card lists en only; hi/zh/fr/es/it/pt voices per upstream VOICES.md - verify per-voice data before use"}
  - {name: "MeloTTS (myshell-ai/MeloTTS-*)", license: MIT, languages: "en, es, fr, zh, ja, ko", note: "MIT; CPU real-time"}
  - {name: "Qwen3-TTS-12Hz-1.7B-Base", license: Apache-2.0, languages: "zh, en, ja, ko, de, fr, ru, pt, es, it",
     note: "Apache-2.0 per HF API (checked 2026-11-12); GPU-class; source of the serena Italian voice data"}
  - {name: "XTTS-v2 (coqui/XTTS-v2)", license: "coqui-public-model-license - NON-COMMERCIAL", languages: "17 incl. ar, hi, zh, tr",
     note: "REJECTED for commercial output; listed so it is not picked by mistake"}
  - {name: "facebook/mms-tts-* (e.g. mms-tts-hin)", license: "cc-by-nc-4.0 - NON-COMMERCIAL", languages: "1100+", note: "REJECTED for commercial output"}
